name: Validate FH6 Assistant v1.4 native transform chain

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/__init__.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_v2.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_v3.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_helper.py"
      - "source-v1.2/tests/test_native_transform_chain_patch.py"
      - "source-v1.2/tests/test_native_transform_chain_v2.py"
      - "source-v1.2/tests/test_native_transform_chain_v3.py"
      - "source-v1.2/tests/test_wheel_morph_helper.py"
      - "source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py"
      - "source-v1.2/tools/kfps_wheel_morph/TransformAudit.cs"
      - "source-v1.2/tools/kfps_wheel_morph/WheelMorphDiagnostic.cs"
      - ".github/workflows/validate-v1.4-native-transform-chain.yml"

permissions:
  contents: read

concurrency:
  group: v14-native-transform-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} native transform chain
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile transform-chain path
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/native_transform_chain_patch.py
          python -m py_compile fh6garage/preview3d/native_transform_chain_v2.py
          python -m py_compile fh6garage/preview3d/native_transform_chain_v3.py
          python -m py_compile fh6garage/preview3d/wheel_morph_helper.py
          python -m py_compile fh6garage/preview3d/__init__.py
          python -m unittest tests.test_native_transform_chain_patch -v
          python -m unittest tests.test_native_transform_chain_v2 -v
          python -m unittest tests.test_native_transform_chain_v3 -v
          python -m unittest tests.test_wheel_morph_helper -v
          python -m unittest tests.test_tire_preview_integration -v
      - name: Run full regression suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

  helper:
    name: Build KFPS transform-audit helper
    runs-on: windows-latest
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Checkout pinned KFPS source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/heyitshestia/kloudys-forza-painter-suite.git kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS clone failed with exit code $LASTEXITCODE" }
          git -C kfps-source checkout --detach 6f53ca3c584d78659d06d4b4a39561db67d79345
          if ($LASTEXITCODE -ne 0) { throw "Pinned KFPS checkout failed with exit code $LASTEXITCODE" }
          $actual = (git -C kfps-source rev-parse HEAD).Trim()
          if ($actual -ne "6f53ca3c584d78659d06d4b4a39561db67d79345") { throw "Pinned KFPS commit mismatch: $actual" }
      - name: Apply W3 transform-chain patch
        shell: pwsh
        run: |
          python source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "Transform-chain patcher failed with exit code $LASTEXITCODE" }
          git -C kfps-source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched KFPS diff check failed with exit code $LASTEXITCODE" }
          $program = "kfps-source/tools/livery/chassis-converter/Program.cs"
          if (-not (Select-String -Path $program -SimpleMatch "TransformAuditRuntime.Configure(instances)" -Quiet)) { throw "TransformAuditRuntime.Configure is missing." }
          if (-not (Select-String -Path $program -SimpleMatch "TransformAuditRuntime.RegisterSceneSkeleton(rootEntry, rootModel.Bundle)" -Quiet)) { throw "Scene CarBody skeleton registration is missing." }
          if (-not (Select-String -Path $program -SimpleMatch "wheel_style_anchors = TransformAuditRuntime.WheelStyleAnchors" -Quiet)) { throw "WheelStyle anchor diagnostics are missing." }
          if (-not (Select-String -Path $program -SimpleMatch "scene_attachment_skeleton_count = TransformAuditRuntime.SceneSkeletonCount" -Quiet)) { throw "Scene skeleton diagnostics are missing." }
          if (-not (Test-Path "kfps-source/tools/livery/chassis-converter/TransformAudit.cs")) { throw "TransformAudit.cs was not staged." }
      - name: Publish helper and report SHA-256
        shell: pwsh
        run: |
          dotnet publish kfps-source/tools/livery/chassis-converter/Kfps.ChassisConverter.csproj -c Release -o transform-chain-converter
          if ($LASTEXITCODE -ne 0) { throw "Transform-chain converter publish failed with exit code $LASTEXITCODE" }
          $built = Resolve-Path "transform-chain-converter/Kfps.ChassisConverter.exe"
          $hash = (Get-FileHash $built -Algorithm SHA256).Hash.ToLower()
          $expected = (python -c "import runpy; print(runpy.run_path(r'source-v1.2/fh6garage/preview3d/wheel_morph_helper.py')['WHEEL_MORPH_HELPER_SHA256'])").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $expected) { throw "Could not read pinned helper SHA-256." }
          Write-Host "TRANSFORM_CHAIN_HELPER_SHA256=$hash"
          Write-Host "PINNED_HELPER_SHA256=$expected"
          if ($hash -ne $expected) {
            Write-Warning "Transform-chain helper changed; update the source pin after this validation run."
          }
          Copy-Item $built "Kfps.ChassisConverter.WheelMorph.exe" -Force
      - name: Upload transform-chain helper
        uses: actions/upload-artifact@v4
        with:
          name: FH6-KFPS-Transform-Chain-Helper
          path: Kfps.ChassisConverter.WheelMorph.exe
          retention-days: 14
          if-no-files-found: error
