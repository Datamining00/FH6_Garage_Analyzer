name: Apply v1.3 PyInstaller restart fix

on:
  push:
    branches:
      - v1.3-work
    paths:
      - ".github/workflows/apply-v1.3-restart-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.3 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.3-work
          persist-credentials: true

      - name: Patch restart behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("source-v1.2/fh6garage/v1_3_ui_patch.py")
          source = path.read_text(encoding="utf-8")
          if "import os\n" not in source:
              source = source.replace("import ctypes\nimport sys\n", "import ctypes\nimport os\nimport sys\n", 1)

          old = (
              "    def restart_for_language_change(self) -> None:\n"
              "        self.settings.sync()\n"
              "        program = QApplication.applicationFilePath()\n"
              "        arguments = QApplication.arguments()[1:]\n"
              "        result = QProcess.startDetached(program, arguments)\n"
              "        started = result[0] if isinstance(result, tuple) else bool(result)\n"
              "        if not started:\n"
              "            QMessageBox.warning(\n"
              "                self,\n"
              "                _restart_failed_title(),\n"
              "                _restart_failed_message(),\n"
              "            )\n"
              "            return\n"
              "        QApplication.quit()\n"
          )
          new = (
              "    def restart_for_language_change(self) -> None:\n"
              "        self.settings.sync()\n"
              "\n"
              "        # A PyInstaller onefile restart must be a fresh top-level instance.\n"
              "        # Otherwise PyInstaller 6.9+ may reuse the current _MEI directory,\n"
              "        # which is removed as the old instance exits.\n"
              '        frozen = bool(getattr(sys, "frozen", False))\n'
              "        if frozen:\n"
              "            program = sys.executable\n"
              "            arguments = QApplication.arguments()[1:]\n"
              "        else:\n"
              "            program = sys.executable\n"
              "            arguments = QApplication.arguments()\n"
              "\n"
              '        reset_key = "PYINSTALLER_RESET_ENVIRONMENT"\n'
              "        previous_reset = os.environ.get(reset_key)\n"
              "        if frozen:\n"
              '            os.environ[reset_key] = "1"\n'
              "        try:\n"
              "            result = QProcess.startDetached(program, arguments)\n"
              "        finally:\n"
              "            if frozen:\n"
              "                if previous_reset is None:\n"
              "                    os.environ.pop(reset_key, None)\n"
              "                else:\n"
              "                    os.environ[reset_key] = previous_reset\n"
              "\n"
              "        started = result[0] if isinstance(result, tuple) else bool(result)\n"
              "        if not started:\n"
              "            QMessageBox.warning(\n"
              "                self,\n"
              "                _restart_failed_title(),\n"
              "                _restart_failed_message(),\n"
              "            )\n"
              "            return\n"
              "        QApplication.quit()\n"
          )
          if old not in source:
              raise SystemExit("Expected language restart function was not found.")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          test = Path("source-v1.2/tests/test_v1_3_restart_environment.py")
          test.write_text(
              "from __future__ import annotations\n\n"
              "import unittest\n"
              "from pathlib import Path\n\n"
              "ROOT = Path(__file__).resolve().parents[1]\n\n"
              "class V13RestartEnvironmentTests(unittest.TestCase):\n"
              "    def test_onefile_restart_resets_pyinstaller_environment(self) -> None:\n"
              "        source = (ROOT / 'fh6garage' / 'v1_3_ui_patch.py').read_text(encoding='utf-8')\n"
              "        self.assertIn('PYINSTALLER_RESET_ENVIRONMENT', source)\n"
              "        self.assertIn('os.environ[reset_key] = \"1\"', source)\n"
              "        self.assertIn('program = sys.executable', source)\n"
              "        self.assertLess(source.index('os.environ[reset_key] = \"1\"'), source.index('QProcess.startDetached(program, arguments)'))\n\n"
              "    def test_restart_restores_parent_environment_after_spawn(self) -> None:\n"
              "        source = (ROOT / 'fh6garage' / 'v1_3_ui_patch.py').read_text(encoding='utf-8')\n"
              "        self.assertIn('previous_reset = os.environ.get(reset_key)', source)\n"
              "        self.assertIn('os.environ.pop(reset_key, None)', source)\n"
              "        self.assertIn('os.environ[reset_key] = previous_reset', source)\n\n"
              "if __name__ == '__main__':\n"
              "    unittest.main()\n",
              encoding="utf-8",
          )
          PY

      - name: Validate patched source
        shell: bash
        run: |
          python -m compileall -q source-v1.2
          python -m unittest source-v1.2/tests/test_v1_3_restart_environment.py -v
          git diff --check

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "AAA"
          git config user.email "49602959+Datamining00@users.noreply.github.com"
          git add source-v1.2/fh6garage/v1_3_ui_patch.py source-v1.2/tests/test_v1_3_restart_environment.py
          git commit -m "Fix onefile language restart environment"
          git push origin HEAD:v1.3-work
