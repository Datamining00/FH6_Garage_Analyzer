name: Validate FH6 Assistant v1.4 rim/tire/material production contract

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py"
      - "source-v1.2/fh6garage/preview3d/__init__.py"
      - "source-v1.2/fh6garage/preview3d/chassis_converter.py"
      - "source-v1.2/fh6garage/preview3d/glb_viewer.py"
      - "source-v1.2/fh6garage/preview3d/material_appearance_patch.py"
      - "source-v1.2/fh6garage/preview3d/material_runtime_wiring_patch.py"
      - "source-v1.2/fh6garage/preview3d/livery_paint_provenance.py"
      - "source-v1.2/fh6garage/preview3d/livery_paint_runtime_patch.py"
      - "source-v1.2/fh6garage/preview3d/livery_paint_binding.py"
      - "source-v1.2/fh6garage/preview3d/livery_paint_secondary_diagnostics.py"
      - "source-v1.2/fh6garage/preview3d/manufacturer_colors.py"
      - "source-v1.2/fh6garage/preview3d/manufacturer_overlay_diagnostics.py"
      - "source-v1.2/fh6garage/preview3d/native_material_textures.py"
      - "source-v1.2/fh6garage/preview3d/native_texture_semantics.py"
      - "source-v1.2/fh6garage/preview3d/native_dds.py"
      - "source-v1.2/fh6garage/preview3d/native_material_gl.py"
      - "source-v1.2/fh6garage/preview3d/native_material_render_plan.py"
      - "source-v1.2/fh6garage/preview3d/native_material_texture_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_normal_texture_diagnostics.py"
      - "source-v1.2/fh6garage/preview3d/native_normal_texture_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_v2.py"
      - "source-v1.2/fh6garage/preview3d/native_transform_chain_v3.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_weights.py"
      - "source-v1.2/fh6garage/preview3d/tire_preview_integration.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_policy.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_trial_geometry.py"
      - "source-v1.2/fh6garage/preview3d/tire_spindle_attachment.py"
      - "source-v1.2/fh6garage/preview3d/tire_spindle_glb_merge.py"
      - "source-v1.2/fh6garage/preview3d/tire_viewer_matrix_bake.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_auto.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_helper.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_runtime.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_weights.py"
      - "source-v1.2/fh6garage/preview3d/wheel_spec_database.py"
      - "source-v1.2/tests/test_chassis_converter_auto_rim_morph.py"
      - "source-v1.2/tests/test_chassis_converter_wheel_morph_helper.py"
      - "source-v1.2/tests/test_material_appearance_patch.py"
      - "source-v1.2/tests/test_material_provenance_bridge.py"
      - "source-v1.2/tests/test_material_runtime_wiring_patch.py"
      - "source-v1.2/tests/test_livery_paint_provenance.py"
      - "source-v1.2/tests/test_livery_paint_runtime_patch.py"
      - "source-v1.2/tests/test_livery_paint_binding.py"
      - "source-v1.2/tests/test_livery_paint_binding_global_gate.py"
      - "source-v1.2/tests/test_livery_paint_secondary_diagnostics.py"
      - "source-v1.2/tests/test_manufacturer_colors.py"
      - "source-v1.2/tests/test_manufacturer_overlay_diagnostics.py"
      - "source-v1.2/tests/test_native_material_textures.py"
      - "source-v1.2/tests/test_native_texture_semantics.py"
      - "source-v1.2/tests/test_native_dds.py"
      - "source-v1.2/tests/test_native_material_gl.py"
      - "source-v1.2/tests/test_native_material_render_plan.py"
      - "source-v1.2/tests/test_native_material_texture_patch.py"
      - "source-v1.2/tests/test_native_normal_texture_diagnostics.py"
      - "source-v1.2/tests/test_native_normal_texture_patch.py"
      - "source-v1.2/tests/test_native_transform_chain_patch.py"
      - "source-v1.2/tests/test_native_transform_chain_v2.py"
      - "source-v1.2/tests/test_native_transform_chain_v3.py"
      - "source-v1.2/tests/test_tire_preview_integration.py"
      - "source-v1.2/tests/test_tire_production_policy.py"
      - "source-v1.2/tests/test_tire_production_trial_geometry.py"
      - "source-v1.2/tests/test_tire_spindle_attachment.py"
      - "source-v1.2/tests/test_tire_spindle_glb_merge.py"
      - "source-v1.2/tests/test_tire_viewer_matrix_bake.py"
      - "source-v1.2/tests/test_wheel_morph_auto.py"
      - "source-v1.2/tests/test_wheel_morph_helper.py"
      - "source-v1.2/tests/test_wheel_morph_runtime.py"
      - "source-v1.2/tests/test_wheel_spec_database.py"
      - "source-v1.2/tools/analyze_livery_paint.py"
      - "source-v1.2/tools/analyze_manufacturer_overlay.py"
      - "source-v1.2/tools/kfps_wheel_morph/MaterialAppearanceDiagnostic.cs"
      - "source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py"
      - "source-v1.2/tools/merge_native_tire_spindle_trial_glb.py"
      - "source-v1.2/tools/validate_native_tire_spindle_attachment.py"
      - ".github/workflows/validate-v1.4-wheel-morph-production-contract.yml"

permissions:
  contents: read

concurrency:
  group: v14-wheel-morph-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile production rim/tire/material contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/v1_4_finalverify1_preview_patch.py
          python -m py_compile fh6garage/preview3d/material_appearance_patch.py
          python -m py_compile fh6garage/preview3d/material_runtime_wiring_patch.py
          python -m py_compile fh6garage/preview3d/livery_paint_provenance.py
          python -m py_compile fh6garage/preview3d/livery_paint_runtime_patch.py
          python -m py_compile fh6garage/preview3d/livery_paint_binding.py
          python -m py_compile fh6garage/preview3d/livery_paint_secondary_diagnostics.py
          python -m py_compile fh6garage/preview3d/manufacturer_colors.py
          python -m py_compile fh6garage/preview3d/manufacturer_overlay_diagnostics.py
          python -m py_compile fh6garage/preview3d/native_material_textures.py
          python -m py_compile fh6garage/preview3d/native_texture_semantics.py
          python -m py_compile fh6garage/preview3d/native_dds.py
          python -m py_compile fh6garage/preview3d/native_material_gl.py
          python -m py_compile fh6garage/preview3d/native_material_render_plan.py
          python -m py_compile fh6garage/preview3d/native_material_texture_patch.py
          python -m py_compile fh6garage/preview3d/native_normal_texture_diagnostics.py
          python -m py_compile fh6garage/preview3d/native_normal_texture_patch.py
          python -m py_compile fh6garage/preview3d/native_transform_chain_patch.py
          python -m py_compile fh6garage/preview3d/native_transform_chain_v2.py
          python -m py_compile fh6garage/preview3d/native_transform_chain_v3.py
          python -m py_compile fh6garage/preview3d/tire_morph_weights.py
          python -m py_compile fh6garage/preview3d/tire_preview_integration.py
          python -m py_compile fh6garage/preview3d/tire_production_policy.py
          python -m py_compile fh6garage/preview3d/tire_production_trial_geometry.py
          python -m py_compile fh6garage/preview3d/tire_spindle_attachment.py
          python -m py_compile fh6garage/preview3d/tire_spindle_glb_merge.py
          python -m py_compile fh6garage/preview3d/tire_viewer_matrix_bake.py
          python -m py_compile tools/analyze_livery_paint.py
          python -m py_compile tools/analyze_manufacturer_overlay.py
          python -m py_compile tools/merge_native_tire_spindle_trial_glb.py
          python -m py_compile tools/validate_native_tire_spindle_attachment.py
          python -m py_compile fh6garage/preview3d/wheel_morph_auto.py
          python -m py_compile fh6garage/preview3d/wheel_morph_helper.py
          python -m py_compile fh6garage/preview3d/wheel_morph_runtime.py
          python -m py_compile fh6garage/preview3d/wheel_morph_weights.py
          python -m py_compile fh6garage/preview3d/wheel_spec_database.py
          python -m py_compile fh6garage/preview3d/chassis_converter.py

      - name: Run production rim/tire/material contract tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest tests.test_material_appearance_patch -v
          python -m unittest tests.test_material_provenance_bridge -v
          python -m unittest tests.test_material_runtime_wiring_patch -v
          python -m unittest tests.test_livery_paint_provenance -v
          python -m unittest tests.test_livery_paint_runtime_patch -v
          python -m unittest tests.test_livery_paint_binding -v
          python -m unittest tests.test_livery_paint_binding_global_gate -v
          python -m unittest tests.test_livery_paint_secondary_diagnostics -v
          python -m unittest tests.test_manufacturer_colors -v
          python -m unittest tests.test_manufacturer_overlay_diagnostics -v
          python -m unittest tests.test_native_material_textures -v
          python -m unittest tests.test_native_texture_semantics -v
          python -m unittest tests.test_native_dds -v
          python -m unittest tests.test_native_material_gl -v
          python -m unittest tests.test_native_material_render_plan -v
          python -m unittest tests.test_native_material_texture_patch -v
          python -m unittest tests.test_native_normal_texture_diagnostics -v
          python -m unittest tests.test_native_normal_texture_patch -v
          python -m unittest tests.test_native_transform_chain_patch -v
          python -m unittest tests.test_native_transform_chain_v2 -v
          python -m unittest tests.test_native_transform_chain_v3 -v
          python -m unittest tests.test_tire_preview_integration -v
          python -m unittest tests.test_tire_production_policy -v
          python -m unittest tests.test_tire_production_trial_geometry -v
          python -m unittest tests.test_tire_spindle_attachment -v
          python -m unittest tests.test_tire_spindle_glb_merge -v
          python -m unittest tests.test_tire_viewer_matrix_bake -v
          python -m unittest tests.test_wheel_morph_runtime -v
          python -m unittest tests.test_wheel_morph_helper -v
          python -m unittest tests.test_wheel_spec_database -v
          python -m unittest tests.test_wheel_morph_auto -v
          python -m unittest tests.test_chassis_converter_wheel_morph_helper -v
          python -m unittest tests.test_chassis_converter_auto_rim_morph -v

      - name: Run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest discover -s tests -v
