name: Validate FH6 Assistant v1.4 wheel spec against real DB

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-spec-w1
    paths:
      - "source-v1.2/fh6garage/preview3d/wheel_spec.py"
      - "source-v1.2/fh6garage/preview3d/wheel_placement.py"
      - "source-v1.2/fh6garage/preview3d/tuning_wheel_selection.py"
      - "source-v1.2/tools/validate_wheel_spec_real_db.py"
      - "source-v1.2/tools/validate_wheel_placement_real_db.py"
      - "source-v1.2/tools/validate_tuning_wheel_real_db.py"
      - "source-v1.2/tests/test_wheel_spec.py"
      - "source-v1.2/tests/test_wheel_placement.py"
      - "source-v1.2/tests/test_tuning_wheel_selection.py"
      - ".github/workflows/validate-v1.4-wheel-spec-real-db.yml"

permissions:
  contents: read

jobs:
  validate-real-db:
    name: Real FH6 DB wheel/tuning validation
    runs-on: windows-latest

    steps:
      - name: Checkout wheel branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download pinned public FH6 DB reference
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path real-db | Out-Null
          $uri = "https://raw.githubusercontent.com/Dr-hydra/FH6-Adjust-Tool/0492493a26f587cb8859d69ae6fbe69e3f59a878/src/FH6AdjustTool/Data/fh6_game_db.sqlite"
          Invoke-WebRequest -Uri $uri -OutFile "real-db\fh6_game_db.sqlite"
          $size = (Get-Item "real-db\fh6_game_db.sqlite").Length
          if ($size -ne 15773696) {
            throw "Pinned FH6 DB size mismatch: $size"
          }

      - name: Verify pinned Git blob identity
        shell: pwsh
        run: |
          $actual = python -c "import hashlib,pathlib; p=pathlib.Path(r'real-db/fh6_game_db.sqlite'); d=p.read_bytes(); print(hashlib.sha1(f'blob {len(d)}\0'.encode('ascii')+d).hexdigest())"
          if ($actual.Trim() -ne "2cc259bd7f3815109b5f95c8e979cb5ec0b892dc") {
            throw "Pinned FH6 DB Git blob mismatch: $actual"
          }

      - name: Compile W1 and W2 resolvers
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m py_compile `
            fh6garage\preview3d\wheel_spec.py `
            fh6garage\preview3d\wheel_placement.py `
            fh6garage\preview3d\tuning_wheel_selection.py `
            tools\validate_wheel_spec_real_db.py `
            tools\validate_wheel_placement_real_db.py `
            tools\validate_tuning_wheel_real_db.py

      - name: Run synthetic W1 and W2 regression
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m unittest `
            tests.test_wheel_spec `
            tests.test_wheel_placement `
            tests.test_tuning_wheel_selection -v

      - name: Validate real DB wheel specs
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python tools\validate_wheel_spec_real_db.py `
            --db ..\real-db\fh6_game_db.sqlite `
            --output ..\real-db\wheel_spec_real_db_report.json `
            --car-id 1006 `
            --car-id 1229 `
            --car-id 1260

      - name: Validate real DB placement and brakes
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python tools\validate_wheel_placement_real_db.py `
            --db ..\real-db\fh6_game_db.sqlite `
            --output ..\real-db\wheel_placement_real_db_report.json `
            --car-id 1006 `
            --car-id 1229 `
            --car-id 1260

      - name: Validate W2 tuning selection bridge against real DB
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python tools\validate_tuning_wheel_real_db.py `
            --db ..\real-db\fh6_game_db.sqlite `
            --output ..\real-db\tuning_wheel_real_db_report.json `
            --car-id 1006

      - name: Upload validation reports only
        uses: actions/upload-artifact@v6
        with:
          name: FH6_WheelSpec_W2_RealDB_Report
          path: |
            real-db/wheel_spec_real_db_report.json
            real-db/wheel_placement_real_db_report.json
            real-db/tuning_wheel_real_db_report.json
          if-no-files-found: error
          retention-days: 14
