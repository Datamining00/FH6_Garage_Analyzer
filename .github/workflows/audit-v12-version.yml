name: Audit FH6 Assistant v1.2 version metadata

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/audit-v12-version.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit old version strings
        run: python .github/scripts/audit_v12_version.py
