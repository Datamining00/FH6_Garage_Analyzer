name: Validate generic native tire auto inference

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/tire_morph_auto_inference.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_policy.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_trial_geometry.py"
      - "source-v1.2/tests/test_tire_morph_auto_inference.py"
      - "source-v1.2/tests/test_tire_production_policy.py"
      - "source-v1.2/tests/test_tire_production_trial_geometry.py"
      - "source-v1.2/tools/probe_generic_native_tire_auto_inference.py"
      - ".github/workflows/validate-generic-native-tire-auto-inference.yml"

permissions:
  contents: read

concurrency:
  group: generic-native-tire-auto-inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} generic inference
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile generic inference path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/tire_morph_auto_inference.py
          python -m py_compile fh6garage/preview3d/tire_production_policy.py
          python -m py_compile fh6garage/preview3d/tire_production_trial_geometry.py
          python -m py_compile tools/probe_generic_native_tire_auto_inference.py

      - name: Run generic inference regression tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest tests.test_tire_morph_auto_inference -v
          python -m unittest tests.test_tire_production_policy -v
          python -m unittest tests.test_tire_production_trial_geometry -v

      - name: Run full regression suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

  build-probe:
    name: Build local FH6 generic tire verification probe
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install probe build dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Build standalone generic tire probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm --onefile --console --name "FH6 Generic Tire Auto Inference Probe" --paths . tools/probe_generic_native_tire_auto_inference.py
          if ($LASTEXITCODE -ne 0) { throw "Probe PyInstaller build failed with exit code $LASTEXITCODE" }
          $exe = Resolve-Path "dist\FH6 Generic Tire Auto Inference Probe.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Probe SHA-256: $hash"
          @"
          FH6 Generic Tire Auto Inference Probe

          Purpose:
          - Reads the stock wheel/tire DB and the native tire ZIP read-only.
          - Does not use TireModelName-specific selector whitelists.
          - Measures selector 0/1 geometry response from the linked modelbin.
          - Validates inferred stock width and outer diameter before acceptance.
          - Writes a persistent JSON diagnostic under LocalAppData.

          Example:
          "FH6 Generic Tire Auto Inference Probe.exe" --cars "C:\XboxGames\Forza Horizon 6\Content\media\cars" --car-id 247

          Optional explicit report:
          "FH6 Generic Tire Auto Inference Probe.exe" --cars "C:\XboxGames\Forza Horizon 6\Content\media\cars" --car-id 247 --output "C:\Temp\car_247_generic_tire.json"

          Source archive and game database are opened/read without modification.
          "@ | Set-Content -Path "dist\README-Generic-Tire-Probe.txt" -Encoding UTF8

      - name: Upload generic tire verification probe
        uses: actions/upload-artifact@v7
        with:
          name: FH6-Generic-Native-Tire-Auto-Inference-Probe
          path: |
            source-v1.2/dist/FH6 Generic Tire Auto Inference Probe.exe
            source-v1.2/dist/README-Generic-Tire-Probe.txt
          retention-days: 14
          if-no-files-found: error
