name: Build FH6 Assistant v1.3.2 Windows test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3.2-work
    paths:
      - ".github/workflows/build-v1.3.2-windows.yml"
      - "source-v1.2/**"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout v1.3.2 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.3.2-work

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build single Windows EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec

          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) {
            throw "FH6 Assistant v1.3.2.exe was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) {
            throw "Built EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built EXE bytes: $size"

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $version = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion: $($version.FileVersion)"
          Write-Host "ProductVersion: $($version.ProductVersion)"
          Write-Host "OriginalFilename: $($version.OriginalFilename)"
          if (-not $version.FileVersion.StartsWith("1.3.2")) {
            throw "Unexpected FileVersion: $($version.FileVersion)"
          }
          if (-not $version.ProductVersion.StartsWith("1.3.2")) {
            throw "Unexpected ProductVersion: $($version.ProductVersion)"
          }
          if ($version.OriginalFilename -ne "FH6 Assistant v1.3.2.exe") {
            throw "Unexpected OriginalFilename: $($version.OriginalFilename)"
          }

      - name: Smoke test bundled EXE startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "Bundled EXE exited during startup smoke test with code $($proc.ExitCode)."
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Bundled EXE remained running through the 8-second startup smoke test."

      - name: Prepare artifact and SHA-256
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe "artifact\FH6 Assistant v1.3.2.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2.exe" | Set-Content -Path "artifact\FH6 Assistant v1.3.2.exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload Windows test build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Windows_v1.3.2_test
          path: |
            artifact/FH6 Assistant v1.3.2.exe
            artifact/FH6 Assistant v1.3.2.exe.sha256
          if-no-files-found: error
          compression-level: 0
