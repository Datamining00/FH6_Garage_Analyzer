name: Build FH6 Assistant v1.3.2 Windows test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3.2-work
    paths:
      - ".github/workflows/build-v1.3.2-windows.yml"
      - "source-v1.2/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-v1.3.2-windows.yml"
      - "source-v1.2/**"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout v1.3.2 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.3.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build v1.3.2 diagnostic EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec

          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) {
            throw "FH6 Assistant v1.3.2.exe was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) {
            throw "Built EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built v1.3.2 EXE bytes: $size"

      - name: Build exact v1.3.1 control EXE
        shell: pwsh
        run: |
          $controlRoot = Join-Path $env:RUNNER_TEMP "fh6-v131-control"
          if (Test-Path $controlRoot) {
            Remove-Item $controlRoot -Recurse -Force
          }
          git fetch origin v1.3.1-work
          $controlSha = (git rev-parse origin/v1.3.1-work).Trim()
          Write-Host "v1.3.1 control SHA: $controlSha"
          git worktree add --detach $controlRoot origin/v1.3.1-work
          Set-Location (Join-Path $controlRoot "source-v1.2")
          python -m compileall -q .
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.1.spec
          $controlExe = Join-Path $PWD "dist\FH6 Assistant v1.3.1.exe"
          if (-not (Test-Path $controlExe)) {
            throw "Exact v1.3.1 control EXE was not created."
          }
          $size = (Get-Item $controlExe).Length
          if ($size -lt 10000000) {
            throw "Control EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built v1.3.1 control EXE bytes: $size"

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $version = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion: $($version.FileVersion)"
          Write-Host "ProductVersion: $($version.ProductVersion)"
          Write-Host "OriginalFilename: $($version.OriginalFilename)"
          if (-not $version.FileVersion.StartsWith("1.3.2")) {
            throw "Unexpected FileVersion: $($version.FileVersion)"
          }
          if (-not $version.ProductVersion.StartsWith("1.3.2")) {
            throw "Unexpected ProductVersion: $($version.ProductVersion)"
          }
          if ($version.OriginalFilename -ne "FH6 Assistant v1.3.2.exe") {
            throw "Unexpected OriginalFilename: $($version.OriginalFilename)"
          }

      - name: Smoke test v1.3.2 startup responsiveness
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "Bundled EXE exited during startup smoke test with code $($proc.ExitCode)."
          }
          if (-not $proc.Responding) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Bundled EXE is alive but Windows reports the GUI as Not Responding."
          }
          Write-Host "v1.3.2 EXE is alive and Responding after 8 seconds."
          Stop-Process -Id $proc.Id -Force

      - name: Prepare diagnostic and control artifacts
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $controlRoot = Join-Path $env:RUNNER_TEMP "fh6-v131-control"
          $controlExe = Resolve-Path (Join-Path $controlRoot "source-v1.2\dist\FH6 Assistant v1.3.1.exe")
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item $exe "artifact\FH6 Assistant v1.3.2 TRACE.exe" -Force
          Copy-Item $controlExe "artifact\FH6 Assistant v1.3.1 CONTROL.exe" -Force

          $hash132 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $hash131 = (Get-FileHash $controlExe -Algorithm SHA256).Hash.ToLower()
          "$hash132  FH6 Assistant v1.3.2 TRACE.exe" | Set-Content -Path "artifact\FH6 Assistant v1.3.2 TRACE.exe.sha256" -Encoding ascii
          "$hash131  FH6 Assistant v1.3.1 CONTROL.exe" | Set-Content -Path "artifact\FH6 Assistant v1.3.1 CONTROL.exe.sha256" -Encoding ascii
          Write-Host "v1.3.2 TRACE SHA-256: $hash132"
          Write-Host "v1.3.1 CONTROL SHA-256: $hash131"

      - name: Upload Windows diagnostic builds
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Windows_v1.3.2_diagnostic_pair
          path: |
            artifact/FH6 Assistant v1.3.2 TRACE.exe
            artifact/FH6 Assistant v1.3.2 TRACE.exe.sha256
            artifact/FH6 Assistant v1.3.1 CONTROL.exe
            artifact/FH6 Assistant v1.3.1 CONTROL.exe.sha256
          if-no-files-found: error
          compression-level: 0
