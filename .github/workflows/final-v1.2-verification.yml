name: Final FH6 Assistant v1.2 verification

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/final-v1.2-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout v1.2 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source-v1.2/requirements.txt pyinstaller

      - name: Compile all Python source
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .

      - name: Run full regression suite
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

      - name: Verify application contracts
        shell: pwsh
        run: |
          Set-Location source-v1.2
          @'
          import ast
          import json
          from pathlib import Path

          root = Path('.')

          # Vehicle DB and the Furai regression anchor.
          db = json.loads((root / 'data' / 'car_names.json').read_text(encoding='utf-8'))
          cars = db.get('cars', {})
          assert db.get('count') == 660
          assert len(cars) == 660
          assert '1229' in cars
          assert 'Furai' in str(cars['1229'])

          # Version/build metadata must be internally consistent.
          app = (root / 'app.py').read_text(encoding='utf-8')
          ui = (root / 'fh6garage' / 'ui.py').read_text(encoding='utf-8')
          spec = (root / 'FH6_Assistant_v1.2.spec').read_text(encoding='utf-8')
          version = (root / 'version_info.txt').read_text(encoding='utf-8')
          build = (root / 'build_exe.ps1').read_text(encoding='utf-8')

          assert 'app.setApplicationVersion("1.2")' in app
          assert "name='FH6 Assistant v1.2'" in spec
          assert "OriginalFilename', 'FH6 Assistant v1.2.exe'" in version
          assert "ProductVersion', '1.2'" in version
          assert 'FH6_Assistant_v1.2.spec' in build
          assert 'FH6 Assistant v1.2.exe' in build

          # The completed v1.2 application source should not advertise v1.1.
          # Tests may contain v1.1 only when explicitly referring to the protected baseline;
          # production/runtime/build files may not.
          runtime_files = [
              root / 'app.py',
              root / 'fh6garage' / 'ui.py',
              root / 'fh6garage' / 'i18n.py',
              root / 'FH6_Assistant_v1.2.spec',
              root / 'version_info.txt',
              root / 'build_exe.ps1',
          ]
          stale = []
          for path in runtime_files:
              text = path.read_text(encoding='utf-8')
              if 'v1.1' in text or '1.1.0.0' in text:
                  stale.append(str(path))
          assert not stale, f'Stale v1.1 production strings: {stale}'

          # i18n catalog must have complete Korean/English coverage.
          ns = {}
          i18n_path = root / 'fh6garage' / 'i18n.py'
          module = ast.parse(i18n_path.read_text(encoding='utf-8'))
          translations = None
          for node in module.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '_TRANSLATIONS':
                  translations = ast.literal_eval(node.value)
                  break
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '_TRANSLATIONS' for t in node.targets):
                  translations = ast.literal_eval(node.value)
                  break
          assert isinstance(translations, dict) and translations
          missing = []
          empty = []
          for key, entry in translations.items():
              if not isinstance(entry, dict) or 'ko' not in entry or 'en' not in entry:
                  missing.append(key)
                  continue
              if not str(entry['ko']).strip() or not str(entry['en']).strip():
                  empty.append(key)
          assert not missing, f'i18n entries missing ko/en: {missing}'
          assert not empty, f'i18n entries with empty text: {empty}'

          # Single-EXE bundled resources.
          assert (root / 'icons' / 'FH6_Assistant.ico').is_file()
          assert (root / 'data' / 'car_names.json').is_file()
          assert "('data' / 'car_names.json')" not in spec  # avoid malformed literal construction
          assert "project_root / 'data' / 'car_names.json'" in spec
          assert "project_root / 'icons' / 'FH6_Assistant.ico'" in spec
          assert 'console=False' in spec

          # Removed thumbnail editing module must stay absent.
          assert not (root / 'fh6garage' / 'thumbnail_labeler.py').exists()

          print(f'Vehicle DB: {len(cars)} entries; Furai={cars["1229"]}')
          print(f'i18n catalog: {len(translations)} complete ko/en entries')
          print('Version metadata: v1.2 consistent')
          print('Bundled resources: present')
          '@ | Set-Content -Path final_contracts.py -Encoding UTF8
          python final_contracts.py
          Remove-Item final_contracts.py -Force

      - name: Verify protected v1.1 baseline
        shell: pwsh
        run: |
          $expected = "757cf0349b9b2240273c99f892497e3f89438333"
          $actual = (git rev-parse "HEAD:source-v1.1").Trim()
          if ($actual -ne $expected) {
            throw "v1.1 baseline tree changed. Expected $expected, got $actual"
          }
          Write-Host "v1.1 baseline preserved: $actual"

      - name: Build one-file Windows executable
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.2.spec

      - name: Validate final EXE package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "source-v1.2\dist"
          $files = @(Get-ChildItem -Path $dist -File)
          $dirs = @(Get-ChildItem -Path $dist -Directory)
          if ($files.Count -ne 1) { throw "Expected exactly one file in dist; got $($files.Count)." }
          if ($dirs.Count -ne 0) { throw "Expected no sidecar directories in dist; got $($dirs.Count)." }

          $exe = $files[0]
          if ($exe.Name -ne "FH6 Assistant v1.2.exe") { throw "Unexpected EXE name: $($exe.Name)" }
          if ($exe.Length -lt 30000000) { throw "EXE is unexpectedly small: $($exe.Length) bytes" }

          $version = $exe.VersionInfo
          if ($version.FileVersion -notlike "1.2*") { throw "Unexpected FileVersion: $($version.FileVersion)" }
          if ($version.ProductVersion -notlike "1.2*") { throw "Unexpected ProductVersion: $($version.ProductVersion)" }
          if ($version.ProductName -ne "FH6 Assistant") { throw "Unexpected ProductName: $($version.ProductName)" }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "EXE: $($exe.Name)"
          Write-Host "Size: $($exe.Length) bytes"
          Write-Host "FileVersion: $($version.FileVersion)"
          Write-Host "ProductVersion: $($version.ProductVersion)"
          Write-Host "SHA-256: $hash"
          "$hash  $($exe.Name)" | Set-Content -Path (Join-Path $dist "FH6 Assistant v1.2.exe.sha256") -Encoding ascii

      - name: Smoke-test EXE startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.2.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "EXE exited during startup smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Startup smoke test: process remained alive for 8 seconds."

      - name: Upload verified EXE
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Assistant-v1.2-final-verification
          path: |
            source-v1.2/dist/FH6 Assistant v1.2.exe
            source-v1.2/dist/FH6 Assistant v1.2.exe.sha256
          if-no-files-found: error
