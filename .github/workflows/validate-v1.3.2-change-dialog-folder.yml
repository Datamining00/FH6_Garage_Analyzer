name: Validate v1.3.2 Change Dialog Folder

on:
  push:
    branches:
      - v1.3.2-change-dialog-folder-actions
  pull_request:
    branches:
      - v1.3.2-change-dialog-folder-actions

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies once
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build Standard one-file EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) { throw "Standard EXE was not created." }
          if ((Get-Item $exe).Length -lt 10000000) { throw "Standard EXE is unexpectedly small." }

      - name: Smoke test Standard
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Standard EXE exited during startup smoke test." }
          if (-not $proc.Responding) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Standard EXE is alive but Not Responding."
          }
          Stop-Process -Id $proc.Id -Force

      - name: Preserve Standard and build Portable onedir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_standard | Out-Null
          $standard = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          Copy-Item $standard "package_standard\FH6 Assistant v1.3.2 Standard.exe" -Force
          $hash = (Get-FileHash $standard -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2 Standard.exe" | Set-Content "package_standard\FH6 Assistant v1.3.2 Standard.exe.sha256" -Encoding ascii
          Write-Host "STANDARD_SHA256=$hash"

          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2_portable.spec
          $portable = Join-Path $PWD "dist\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $portable)) { throw "Portable EXE was not created." }

      - name: Smoke test Portable
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Portable EXE exited during startup smoke test." }
          if (-not $proc.Responding) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Portable EXE is alive but Not Responding."
          }
          Stop-Process -Id $proc.Id -Force

      - name: Prepare Portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_portable | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.3.2 Portable" "package_portable\FH6 Assistant v1.3.2 Portable" -Recurse -Force
          $exe = Resolve-Path "package_portable\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2.exe" | Set-Content "package_portable\FH6 Assistant v1.3.2 Portable\EXE_SHA256.txt" -Encoding ascii
          @"
          FH6 Assistant v1.3.2 Portable

          Python installation is not required.
          Run: FH6 Assistant v1.3.2.exe
          Use this package if the Standard one-file EXE does not start correctly.
          "@ | Set-Content "package_portable\FH6 Assistant v1.3.2 Portable\README_PORTABLE.txt" -Encoding utf8
          Write-Host "PORTABLE_EXE_SHA256=$hash"

      - name: Prepare Source launcher package
        shell: pwsh
        run: |
          $dst = "package_source\FH6 Assistant v1.3.2 Source"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\app.py" $dst
          Copy-Item "source-v1.2\run.bat" $dst
          Copy-Item "source-v1.2\FH6 Assistant.vbs" $dst
          Copy-Item "source-v1.2\requirements.txt" $dst
          Copy-Item "source-v1.2\README.txt" $dst
          Copy-Item "source-v1.2\data" $dst -Recurse
          Copy-Item "source-v1.2\icons" $dst -Recurse
          Copy-Item "source-v1.2\fh6garage" $dst -Recurse
          Get-ChildItem $dst -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem $dst -Recurse -File -Filter *.pyc | Remove-Item -Force
          @"
          FH6 Assistant v1.3.2 Source Launcher

          1. Python 3.12 or newer is required.
          2. Run "FH6 Assistant.vbs" for a hidden launcher, or run.bat for diagnostics.
          3. The virtual environment is created under LocalAppData, not inside this folder.
          4. FH6 save/content remains read-only.
          "@ | Set-Content "$dst\README_SOURCE.txt" -Encoding utf8

      - name: Smoke test Source launcher code
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $work = Resolve-Path "package_source\FH6 Assistant v1.3.2 Source"
          $proc = Start-Process -FilePath python -ArgumentList '-B','app.py' -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 6
          $proc.Refresh()
          if ($proc.HasExited) { throw "Source app.py exited during startup smoke test." }
          Stop-Process -Id $proc.Id -Force

      - name: Upload Standard
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Standard_ChangeDialogFolder
          path: package_standard/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload Portable
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Portable_ChangeDialogFolder
          path: package_portable/*
          if-no-files-found: error
          compression-level: 6

      - name: Upload Source
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Source_ChangeDialogFolder
          path: package_source/*
          if-no-files-found: error
          compression-level: 6
