name: Validate FH6 Assistant v1.4 native emissive textures

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/__init__.py"
      - "source-v1.2/fh6garage/preview3d/native_material_texture_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_normal_texture_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_emissive_texture_patch.py"
      - "source-v1.2/fh6garage/preview3d/native_material_render_plan.py"
      - "source-v1.2/fh6garage/preview3d/native_material_gl.py"
      - "source-v1.2/fh6garage/preview3d/native_texture_semantics.py"
      - "source-v1.2/tests/test_native_emissive_texture_patch.py"
      - ".github/workflows/validate-v1.4-native-emissive-textures.yml"

permissions:
  contents: read

concurrency:
  group: v14-native-emissive-textures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} native emissive Texture2D contract
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate native emissive renderer contract
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/native_emissive_texture_patch.py
          python -m py_compile tests/test_native_emissive_texture_patch.py
          python -m unittest tests.test_native_emissive_texture_patch -v
          python -m unittest tests.test_native_material_texture_patch -v
          python -m unittest tests.test_native_normal_texture_patch -v

      - name: Run full regression
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest discover -s tests -p "test_*.py"
