name: Finalize FH6 Assistant v1.3

on:
  push:
    branches:
      - v1.3-work
    paths:
      - "tools/finalize_v1_3.py"
      - ".github/workflows/finalize-v1.3.yml"

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.3 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.3-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source-v1.2/requirements.txt

      - name: Finalize v1.3 source and version metadata
        run: python tools/finalize_v1_3.py

      - name: Compile Python source
        run: python -m compileall -q source-v1.2

      - name: Run full regression and runtime UI tests
        working-directory: source-v1.2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Verify v1.3 version markers
        run: |
          grep -F 'FH6 Assistant v1.3' source-v1.2/fh6garage/ui.py
          grep -F 'app.setApplicationVersion("1.3")' source-v1.2/app.py
          grep -F "name='FH6 Assistant v1.3'" source-v1.2/FH6_Assistant_v1.3.spec
          grep -F "ProductVersion', '1.3'" source-v1.2/version_info.txt

      - name: Commit verified v1.3 finalization
        shell: bash
        run: |
          if git diff --quiet -- source-v1.2; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2
          git commit -m "Finalize FH6 Assistant v1.3 source and version metadata"
          git push origin HEAD:v1.3-work
