name: Apply FTS App Integration

on:
  push:
    branches:
      - v1.4-rc1-forzatechstudio-real-port
    paths:
      - 'tools/fts-chassis-converter/apply_app_integration.py'
      - '.github/workflows/apply-fts-app-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Checkout FTS port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply pinned FTS converter integration
        shell: pwsh
        run: python tools/fts-chassis-converter/apply_app_integration.py

      - name: Compile integration source
        shell: pwsh
        run: python -m py_compile source-v1.2/fh6garage/preview3d/chassis_converter.py

      - name: Run FTS contract tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest source-v1.2/tests/test_fts_converter_contract.py -q

      - name: Commit app integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'source-v1.2/fh6garage/preview3d/chassis_converter.py'
          if (git diff --cached --quiet) {
            Write-Host 'FTS app integration already up to date.'
            exit 0
          }
          git commit -m 'Use ForzaTechStudio converter for 3D geometry'
          git push origin HEAD:v1.4-rc1-forzatechstudio-real-port
