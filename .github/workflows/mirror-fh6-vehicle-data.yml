name: Sync FH6 Vehicle Data Gist

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirror-fh6-vehicle-data.yml"
      - "scripts/sync_fh6_vehicle_data.py"
  schedule:
    # GitHub cron is UTC. These correspond to 08:50, 12:50, 17:50 Asia/Seoul.
    - cron: "50 23 * * *"
    - cron: "50 3 * * *"
    - cron: "50 8 * * *"

permissions:
  contents: write

concurrency:
  group: sync-fh6-vehicle-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone source Gist
        run: |
          rm -rf /tmp/fh6-vehicle-gist
          git clone --depth 1 https://gist.github.com/30fe44689fad7ba5e99e2381927b7730.git /tmp/fh6-vehicle-gist
          test -f /tmp/fh6-vehicle-gist/FH6_Vehicle_Data.json

      - name: Mirror, normalize, and diff
        run: |
          python scripts/sync_fh6_vehicle_data.py \
            --source /tmp/fh6-vehicle-gist/FH6_Vehicle_Data.json \
            --root data/fh6

      - name: Commit synchronization state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fh6

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit -m "Sync FH6 vehicle data from Gist"
          git push origin "HEAD:${GITHUB_REF_NAME}"
