name: Validate FH6 Assistant v1.4 native tire W3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/tire_asset.py"
      - "source-v1.2/fh6garage/preview3d/tire_family_candidates.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_auto_family_validation.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_boundary_roles.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_cross_family_validation.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_formula_evidence.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_formula_pipeline.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_geometry.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_geometry_impl.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_semantic_evidence.py"
      - "source-v1.2/fh6garage/preview3d/tire_morph_weights.py"
      - "source-v1.2/fh6garage/preview3d/tire_stock_geometry_validation.py"
      - "source-v1.2/tests/test_tire_asset.py"
      - "source-v1.2/tests/test_tire_family_candidates.py"
      - "source-v1.2/tests/test_tire_morph_auto_family_validation.py"
      - "source-v1.2/tests/test_tire_morph_boundary_roles.py"
      - "source-v1.2/tests/test_tire_morph_cross_family_validation.py"
      - "source-v1.2/tests/test_tire_morph_formula_evidence.py"
      - "source-v1.2/tests/test_tire_morph_formula_pipeline.py"
      - "source-v1.2/tests/test_tire_morph_geometry.py"
      - "source-v1.2/tests/test_tire_morph_geometry_wire_tags.py"
      - "source-v1.2/tests/test_tire_morph_semantic_evidence.py"
      - "source-v1.2/tests/test_tire_morph_weights.py"
      - "source-v1.2/tests/test_tire_stock_geometry_validation.py"
      - "source-v1.2/tools/analyze_native_tire_selector_roles.py"
      - "source-v1.2/tools/analyze_native_tire_selector_semantics.py"
      - "source-v1.2/tools/bake_native_tire_morph_selectors.py"
      - "source-v1.2/tools/find_native_tire_family_candidates.py"
      - "source-v1.2/tools/inspect_native_tire.py"
      - "source-v1.2/tools/validate_native_tire_morph_auto_families.py"
      - "source-v1.2/tools/validate_native_tire_morph_families.py"
      - "source-v1.2/tools/validate_native_tire_morph_formula.py"
      - ".github/workflows/validate-v1.4-native-tire-w3.yml"

permissions:
  contents: read

concurrency:
  group: v14-native-tire-w3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile native tire diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/tire_asset.py
          python -m py_compile fh6garage/preview3d/tire_family_candidates.py
          python -m py_compile fh6garage/preview3d/tire_morph_auto_family_validation.py
          python -m py_compile fh6garage/preview3d/tire_morph_boundary_roles.py
          python -m py_compile fh6garage/preview3d/tire_morph_cross_family_validation.py
          python -m py_compile fh6garage/preview3d/tire_morph_formula_evidence.py
          python -m py_compile fh6garage/preview3d/tire_morph_formula_pipeline.py
          python -m py_compile fh6garage/preview3d/tire_morph_geometry.py
          python -m py_compile fh6garage/preview3d/tire_morph_geometry_impl.py
          python -m py_compile fh6garage/preview3d/tire_morph_semantic_evidence.py
          python -m py_compile fh6garage/preview3d/tire_morph_weights.py
          python -m py_compile fh6garage/preview3d/tire_stock_geometry_validation.py
          python -m py_compile tools/analyze_native_tire_selector_roles.py
          python -m py_compile tools/analyze_native_tire_selector_semantics.py
          python -m py_compile tools/bake_native_tire_morph_selectors.py
          python -m py_compile tools/find_native_tire_family_candidates.py
          python -m py_compile tools/inspect_native_tire.py
          python -m py_compile tools/validate_native_tire_morph_auto_families.py
          python -m py_compile tools/validate_native_tire_morph_families.py
          python -m py_compile tools/validate_native_tire_morph_formula.py

      - name: Run native tire tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest tests.test_tire_asset -v
          python -m unittest tests.test_tire_family_candidates -v
          python -m unittest tests.test_tire_morph_auto_family_validation -v
          python -m unittest tests.test_tire_morph_boundary_roles -v
          python -m unittest tests.test_tire_morph_cross_family_validation -v
          python -m unittest tests.test_tire_morph_formula_evidence -v
          python -m unittest tests.test_tire_morph_formula_pipeline -v
          python -m unittest tests.test_tire_morph_geometry -v
          python -m unittest tests.test_tire_morph_geometry_wire_tags -v
          python -m unittest tests.test_tire_morph_semantic_evidence -v
          python -m unittest tests.test_tire_morph_weights -v
          python -m unittest tests.test_tire_stock_geometry_validation -v

      - name: Run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v
