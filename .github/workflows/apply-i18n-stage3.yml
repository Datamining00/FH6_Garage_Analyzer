name: Apply FH6 Assistant i18n stage 3

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/apply-i18n-stage3.yml"
      - ".github/scripts/apply_i18n_stage3.py"
      - ".github/scripts/fix_i18n_stage3_patterns.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fix escaped-newline patterns
        run: python .github/scripts/fix_i18n_stage3_patterns.py

      - name: Apply stage 3 patch
        run: python .github/scripts/apply_i18n_stage3.py

      - name: Compile and run regression tests
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Commit stage 3 source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2/fh6garage/i18n.py source-v1.2/fh6garage/ui.py source-v1.2/fh6garage/car_db.py source-v1.2/fh6garage/game_navigation.py source-v1.2/fh6garage/scanner.py source-v1.2/tests/test_i18n_stage3.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Localize remaining UI warnings and error paths"
            git push origin HEAD:v1.2-work
          }
