name: Validate FH6 Assistant v1.4 wheel morph W3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/modelbin_morph.py"
      - "source-v1.2/fh6garage/preview3d/modelbin_morph_profile.py"
      - "source-v1.2/fh6garage/preview3d/modelbin_morph_index_profile.py"
      - "source-v1.2/fh6garage/preview3d/vehicle_morph_diagnostic.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_weights.py"
      - "source-v1.2/fh6garage/preview3d/wheel_spec.py"
      - "source-v1.2/fh6garage/preview3d/wheel_visibility.py"
      - "source-v1.2/fh6garage/preview3d/wheel_mesh_diagnostic.py"
      - "source-v1.2/tests/test_modelbin_morph*.py"
      - "source-v1.2/tests/test_vehicle_morph_diagnostic.py"
      - "source-v1.2/tests/test_vehicle_morph_launcher.py"
      - "source-v1.2/tests/test_wheel_morph_weights.py"
      - "source-v1.2/tests/test_wheelspec_realdb_launcher.py"
      - "source-v1.2/tests/test_wheelspec_realdb_packager.py"
      - "source-v1.2/tests/test_kfps_wheel_morph_diagnostic_patch.py"
      - "source-v1.2/tests/test_wheel_morph_bake_diagnostic.py"
      - "source-v1.2/tests/test_wheel_morph_bake_request_schema.py"
      - "source-v1.2/tools/inspect_modelbin_morph.py"
      - "source-v1.2/tools/inspect_vehicle_morph.py"
      - "source-v1.2/tools/Run_FH6_Wheel_Morph_Diagnostic.cmd"
      - "source-v1.2/tools/Run_FH6_WheelSpec_RealDB_Diagnostic.cmd"
      - "source-v1.2/tools/README_WheelSpec_RealDB_Diagnostic.txt"
      - "source-v1.2/tools/validate_wheel_spec_real_db.py"
      - "source-v1.2/tools/package_wheelspec_realdb_diagnostic.py"
      - "source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py"
      - "source-v1.2/tools/kfps_wheel_morph/WheelMorphDiagnostic.cs"
      - "source-v1.2/tools/run_wheel_morph_bake_diagnostic.py"
      - "source-v1.2/tools/Run_FER_FXX_05_Wheel_Morph_Bake_Diagnostic.cmd"
      - "source-v1.2/tools/README_FER_FXX_05_Wheel_Morph_Bake_Diagnostic.txt"
      - ".github/workflows/validate-v1.4-wheel-morph-w3.yml"

permissions:
  contents: read

concurrency:
  group: v14-wheel-morph-w3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile morph diagnostics
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/modelbin_morph.py
          python -m py_compile fh6garage/preview3d/modelbin_morph_profile.py
          python -m py_compile fh6garage/preview3d/modelbin_morph_index_profile.py
          python -m py_compile fh6garage/preview3d/vehicle_morph_diagnostic.py
          python -m py_compile fh6garage/preview3d/wheel_morph_weights.py
          python -m py_compile fh6garage/preview3d/wheel_spec.py
          python -m py_compile fh6garage/preview3d/wheel_visibility.py
          python -m py_compile fh6garage/preview3d/wheel_mesh_diagnostic.py
          python -m py_compile tools/inspect_modelbin_morph.py
          python -m py_compile tools/inspect_vehicle_morph.py
          python -m py_compile tools/validate_wheel_spec_real_db.py
          python -m py_compile tools/package_wheelspec_realdb_diagnostic.py
          python -m py_compile tools/patch_kfps_wheel_morph_diagnostic.py
          python -m py_compile tools/run_wheel_morph_bake_diagnostic.py

      - name: Run W3 morph tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -p "test_modelbin_morph*.py" -v
          python -m unittest discover -s tests -p "test_vehicle_morph_diagnostic.py" -v
          python -m unittest discover -s tests -p "test_vehicle_morph_launcher.py" -v
          python -m unittest discover -s tests -p "test_wheel_morph_weights.py" -v
          python -m unittest discover -s tests -p "test_wheelspec_realdb_launcher.py" -v
          python -m unittest discover -s tests -p "test_wheelspec_realdb_packager.py" -v
          python -m unittest discover -s tests -p "test_kfps_wheel_morph_diagnostic_patch.py" -v
          python -m unittest discover -s tests -p "test_wheel_morph_bake_diagnostic.py" -v
          python -m unittest discover -s tests -p "test_wheel_morph_bake_request_schema.py" -v

      - name: Run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

  build-wheel-morph-converter:
    name: Build diagnostic KFPS wheel morph converter
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Checkout pinned KFPS source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/heyitshestia/kloudys-forza-painter-suite.git kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS clone failed with exit code $LASTEXITCODE" }
          git -C kfps-source checkout --detach 6f53ca3c584d78659d06d4b4a39561db67d79345
          if ($LASTEXITCODE -ne 0) { throw "Pinned KFPS checkout failed with exit code $LASTEXITCODE" }
          $actual = (git -C kfps-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Pinned KFPS rev-parse failed with exit code $LASTEXITCODE" }
          if ($actual -ne "6f53ca3c584d78659d06d4b4a39561db67d79345") { throw "Pinned KFPS commit mismatch: $actual" }

      - name: Apply diagnostic-only weighted wheel morph patch
        shell: pwsh
        run: |
          python source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "Wheel morph patcher failed with exit code $LASTEXITCODE" }
          git -C kfps-source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched KFPS diff check failed with exit code $LASTEXITCODE" }
          $program = "kfps-source/tools/livery/chassis-converter/Program.cs"
          $helper = "kfps-source/tools/livery/chassis-converter/WheelMorphDiagnostic.cs"
          if (-not (Test-Path $helper)) { throw "WheelMorphDiagnostic.cs was not copied into the converter source tree." }
          if (-not (Select-String -Path $program -SimpleMatch "WheelMorphRuntime.Configure(instances)" -Quiet)) { throw "Patched Program.cs is missing WheelMorphRuntime.Configure." }
          if (-not (Select-String -Path $program -SimpleMatch "wheel_morph_applied_meshes = WheelMorphRuntime.AppliedMeshes" -Quiet)) { throw "Patched Program.cs is missing morph diagnostics." }
          if (-not (Select-String -Path $program -SimpleMatch "TransformPositions(bundle, geometry, instance, instanceTransform)" -Quiet)) { throw "Patched Program.cs is missing morph-aware TransformPositions." }
          git -C kfps-source diff -- tools/livery/chassis-converter/Program.cs tools/livery/chassis-converter/WheelMorphDiagnostic.cs
          if ($LASTEXITCODE -ne 0) { throw "Patched KFPS diff display failed with exit code $LASTEXITCODE" }

      - name: Publish diagnostic converter
        shell: pwsh
        run: |
          dotnet publish kfps-source/tools/livery/chassis-converter/Kfps.ChassisConverter.csproj -c Release -o wheel-morph-converter
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic converter publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "wheel-morph-converter/Kfps.ChassisConverter.exe")) { throw "Diagnostic converter EXE was not published." }
          $dll = "kfps-source/tools/livery/chassis-converter/bin/Release/net9.0/win-x64/Kfps.ChassisConverter.dll"
          if (-not (Test-Path $dll)) { throw "Diagnostic converter DLL was not built." }
          python -c "from pathlib import Path; p=Path(r'$dll'); d=p.read_bytes(); required=[b'wheel_morph_mode', b'wheel_morph_applied_meshes']; missing=[x.decode() for x in required if x not in d]; assert not missing, f'compiled converter is missing morph output tokens: {missing}'; print('compiled morph token verification PASS')"
          if ($LASTEXITCODE -ne 0) { throw "Compiled morph token verification failed with exit code $LASTEXITCODE" }

      - name: Upload diagnostic converter artifact
        uses: actions/upload-artifact@v4
        with:
          name: KFPS-Wheel-Morph-Diagnostic-Converter-W3
          path: wheel-morph-converter
          retention-days: 14
          if-no-files-found: error

  package-four-way-bake-diagnostic:
    name: Package FXX four-way wheel morph bake diagnostic
    needs: [test, build-wheel-morph-converter]
    runs-on: windows-latest
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download diagnostic converter
        uses: actions/download-artifact@v4
        with:
          name: KFPS-Wheel-Morph-Diagnostic-Converter-W3
          path: downloaded-converter

      - name: Build FXX four-way portable package
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $pkg = Join-Path $PWD "fxx-four-way-package"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $pkg "fh6garage\preview3d") | Out-Null
          Copy-Item "downloaded-converter\Kfps.ChassisConverter.exe" $pkg
          Copy-Item "source-v1.2\tools\run_wheel_morph_bake_diagnostic.py" $pkg
          Copy-Item "source-v1.2\tools\Run_FER_FXX_05_Wheel_Morph_Bake_Diagnostic.cmd" $pkg
          Copy-Item "source-v1.2\tools\README_FER_FXX_05_Wheel_Morph_Bake_Diagnostic.txt" $pkg
          Copy-Item "source-v1.2\fh6garage\__init__.py" (Join-Path $pkg "fh6garage\")
          Set-Content -Encoding UTF8 (Join-Path $pkg "fh6garage\preview3d\__init__.py") "# Minimal diagnostic package: production preview3d initialization intentionally omitted."
          Copy-Item "source-v1.2\fh6garage\preview3d\wheel_visibility.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\wheel_mesh_diagnostic.py" (Join-Path $pkg "fh6garage\preview3d\")
          if (-not (Test-Path (Join-Path $pkg "Kfps.ChassisConverter.exe"))) { throw "Packaged diagnostic converter is missing." }
          python (Join-Path $pkg "run_wheel_morph_bake_diagnostic.py") --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged four-way diagnostic help check failed with exit code $LASTEXITCODE" }
          $env:PYTHONPATH = $pkg
          python -c "from fh6garage.preview3d.wheel_visibility import apply_neutral_wheel_visibility; print('neutral wheel visibility import PASS')"
          if ($LASTEXITCODE -ne 0) { throw "Packaged neutral-wheel import check failed with exit code $LASTEXITCODE" }
          Get-ChildItem -Path $pkg -Directory -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force

      - name: Upload FXX four-way diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: FER-FXX-05-Wheel-Morph-Four-Way-Diagnostic-W3
          path: fxx-four-way-package
          retention-days: 14
          if-no-files-found: error

  package-diagnostic:
    name: Package wheel morph diagnostic
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Build portable diagnostic source bundle
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD "diagnostic-package"
          New-Item -ItemType Directory -Force (Join-Path $pkg "tools") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $pkg "fh6garage\preview3d") | Out-Null

          Copy-Item "source-v1.2\tools\Run_FH6_Wheel_Morph_Diagnostic.cmd" (Join-Path $pkg "tools\")
          Copy-Item "source-v1.2\tools\inspect_vehicle_morph.py" (Join-Path $pkg "tools\")
          Copy-Item "source-v1.2\fh6garage\__init__.py" (Join-Path $pkg "fh6garage\")
          Set-Content -Encoding UTF8 (Join-Path $pkg "fh6garage\preview3d\__init__.py") "# Minimal diagnostic package: production preview3d initialization intentionally omitted."
          Copy-Item "source-v1.2\fh6garage\preview3d\vehicle_index.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\near_lod_archive.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\modelbin_morph.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\modelbin_morph_profile.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\modelbin_morph_index_profile.py" (Join-Path $pkg "fh6garage\preview3d\")
          Copy-Item "source-v1.2\fh6garage\preview3d\vehicle_morph_diagnostic.py" (Join-Path $pkg "fh6garage\preview3d\")

          @"
          FH6 Wheel Morph Diagnostic W3
          =============================

          Requirements:
          - Windows
          - Python 3.12+ recommended

          Usage:
          1. Open the tools folder.
          2. Double-click Run_FH6_Wheel_Morph_Diagnostic.cmd.
          3. Select the FH6 vehicle ZIP.
          4. The source ZIP remains read-only.
          5. The JSON report is written to:
             %LOCALAPPDATA%\FH6 Assistant\Diagnostics

          Return the generated *_morph_w3.json file for analysis.
          "@ | Set-Content -Encoding UTF8 (Join-Path $pkg "README.txt")

      - name: Upload wheel morph diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Wheel-Morph-Diagnostic-W3
          path: diagnostic-package
          retention-days: 14
          if-no-files-found: error

  package-realdb-diagnostic:
    name: Package wheel spec RealDB diagnostic
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build portable RealDB diagnostic source bundle
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python tools/package_wheelspec_realdb_diagnostic.py

      - name: Validate portable RealDB package imports
        shell: pwsh
        run: |
          python "source-v1.2\dist\FH6-WheelSpec-RealDB-Diagnostic\tools\validate_wheel_spec_real_db.py" --help

      - name: Upload wheel spec RealDB diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6-WheelSpec-RealDB-Diagnostic-W3
          path: source-v1.2/dist/FH6-WheelSpec-RealDB-Diagnostic
          retention-days: 14
          if-no-files-found: error