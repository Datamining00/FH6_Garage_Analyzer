name: Validate FH6 Assistant v1.4 architecture candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-architecture-candidate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-regression:
    name: Windows regression (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install runtime dependencies
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and run complete regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Verify regression did not alter tracked source
        run: |
          $changes = git status --porcelain --untracked-files=no
          if ($changes) {
            $changes | Write-Host
            throw "Regression tests altered tracked source files."
          }

  build-candidates:
    name: Build and execute three candidates
    needs: windows-regression
    runs-on: windows-latest

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install source runtime dependencies
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Load distribution metadata
        id: metadata
        run: |
          Set-Location source-v1.2
          $json = python -c "import json; from fh6garage.build_metadata import build_metadata; print(json.dumps(build_metadata()))"
          if ($LASTEXITCODE -ne 0) { throw "Unable to load build metadata." }
          $metadata = $json | ConvertFrom-Json
          "standard_name=$($metadata.standard_name)" >> $env:GITHUB_OUTPUT
          "portable_dir_name=$($metadata.portable_dir_name)" >> $env:GITHUB_OUTPUT

      - name: Build Standard and Portable
        run: |
          & .\source-v1.2\build_exe.ps1 -Distribution All

      - name: Verify Windows executable metadata
        run: |
          $name = '${{ steps.metadata.outputs.standard_name }}'
          $exe = Resolve-Path "source-v1.2\dist\$name.exe"
          Push-Location source-v1.2
          try {
            $expected = python -c "from fh6garage.version import VERSION; print(VERSION)"
            if ($LASTEXITCODE -ne 0) { throw "Unable to load runtime version." }
          } finally {
            Pop-Location
          }
          $info = (Get-Item $exe).VersionInfo
          if (-not $info.FileVersion.StartsWith($expected.Split('-')[0])) {
            throw "Unexpected FileVersion: $($info.FileVersion)"
          }
          if ($info.ProductVersion -ne $expected) {
            throw "Unexpected ProductVersion: $($info.ProductVersion)"
          }
          if ($info.OriginalFilename -ne "$name.exe") {
            throw "Unexpected OriginalFilename: $($info.OriginalFilename)"
          }

      - name: Execute Standard with graceful shutdown
        env:
          FH6_ASSISTANT_SMOKE_TEST_MS: "3000"
          PYINSTALLER_STRICT_UNPACK_MODE: "1"
        run: |
          $name = '${{ steps.metadata.outputs.standard_name }}'
          $exe = Resolve-Path "source-v1.2\dist\$name.exe"
          $before = @(Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Standard candidate did not close normally."
          }
          if ($proc.ExitCode -ne 0) { throw "Standard candidate exited with $($proc.ExitCode)." }
          Start-Sleep -Seconds 2
          $leftovers = @(Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue | Where-Object FullName -NotIn $before)
          if ($leftovers.Count -gt 0) { throw "Standard candidate left a PyInstaller extraction directory." }

      - name: Execute Portable with graceful shutdown
        env:
          FH6_ASSISTANT_SMOKE_TEST_MS: "3000"
        run: |
          $name = '${{ steps.metadata.outputs.standard_name }}'
          $portable = '${{ steps.metadata.outputs.portable_dir_name }}'
          $exe = Resolve-Path "source-v1.2\dist\$portable\$name.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Portable candidate did not close normally."
          }
          if ($proc.ExitCode -ne 0) { throw "Portable candidate exited with $($proc.ExitCode)." }

      - name: Package three candidates
        run: |
          $name = '${{ steps.metadata.outputs.standard_name }}'
          $portable = '${{ steps.metadata.outputs.portable_dir_name }}'
          New-Item -ItemType Directory -Force package_standard, package_portable, package_source | Out-Null
          Copy-Item "source-v1.2\dist\$name.exe" package_standard -Force
          Copy-Item "source-v1.2\dist\$portable\*" package_portable -Recurse -Force

          $sourceFiles = @(
            "FH6 Assistant.vbs", "run.bat", "setup_and_run.ps1", "app.py",
            "requirements.txt", "README.txt", "version_info.txt", "build_exe.ps1",
            "FH6_Assistant_v1.3.2.spec", "FH6_Assistant_v1.3.2_portable.spec"
          )
          foreach ($file in $sourceFiles) { Copy-Item "source-v1.2\$file" package_source -Force }
          foreach ($directory in @("data", "icons", "fh6garage", "tests")) {
            Copy-Item "source-v1.2\$directory" package_source -Recurse -Force
          }
          Get-ChildItem package_source -Directory -Recurse -Filter "__pycache__" |
            Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem package_source -File -Recurse |
            Where-Object Extension -In @(".pyc", ".pyo") | Remove-Item -Force

          foreach ($package in @("package_standard", "package_portable", "package_source")) {
            $root = (Resolve-Path $package).Path
            $hashes = foreach ($file in Get-ChildItem $package -File -Recurse | Sort-Object FullName) {
              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
              $relative = $file.FullName.Substring($root.Length + 1)
              "$hash  $relative"
            }
            $hashes | Set-Content "$package\FILES_SHA256.txt" -Encoding ascii
          }

      - name: Execute Source with graceful shutdown
        env:
          FH6_ASSISTANT_SMOKE_TEST_MS: "3000"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $work = Resolve-Path package_source
          $proc = Start-Process -FilePath python -ArgumentList '-B','app.py' -WorkingDirectory $work -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Source candidate did not close normally."
          }
          if ($proc.ExitCode -ne 0) { throw "Source candidate exited with $($proc.ExitCode)." }

      - name: Upload Standard candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Architecture_Candidate_Standard
          path: package_standard/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Portable candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Architecture_Candidate_Portable
          path: package_portable/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Source candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Architecture_Candidate_Source
          path: package_source/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
