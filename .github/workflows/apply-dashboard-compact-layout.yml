name: Apply FH6 Assistant dashboard compact layout

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/apply-dashboard-compact-layout.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply dashboard compact layout patch
        run: python .github/scripts/apply_dashboard_compact_layout.py

      - name: Compile source
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .

      - name: Run regression tests
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2/fh6garage/ui.py source-v1.2/tests/test_dashboard_compact_layout.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix compact dashboard layout for English UI"
            git push origin HEAD:v1.2-work
          }
