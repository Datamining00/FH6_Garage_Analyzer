name: Apply FH6 Assistant v1.3 features

on:
  push:
    branches:
      - v1.3-work
    paths:
      - "tools/apply_v1_3_features.py"
      - "tools/fix_v1_3_patch.py"
      - ".github/workflows/apply-v1.3-features.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.3 work branch
        uses: actions/checkout@v6
        with:
          ref: v1.3-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source-v1.2/requirements.txt

      - name: Apply v1.3 feature patch
        run: |
          python tools/apply_v1_3_features.py
          python tools/fix_v1_3_patch.py

      - name: Compile Python source
        run: python -m compileall -q source-v1.2

      - name: Run regression tests
        working-directory: source-v1.2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Commit verified feature changes
        shell: bash
        run: |
          if git diff --quiet -- source-v1.2; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2
          git commit -m "Implement FH6 Assistant v1.3 dashboard grouping and memo features"
          git push origin HEAD:v1.3-work
