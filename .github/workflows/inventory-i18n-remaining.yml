name: Inventory remaining FH6 Assistant i18n strings

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/inventory-i18n-remaining.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build remaining Korean literal inventory
        shell: pwsh
        run: |
          @'
          import ast
          import re
          from pathlib import Path

          root = Path("source-v1.2/fh6garage")
          korean = re.compile(r"[가-힣]")
          excluded_files = {
              "i18n.py",      # translation catalog
              "parsers.py",   # Korean source-data parsing patterns
              "tune_data.py", # canonical internal tuning labels
          }
          lines = []
          total = 0
          for path in sorted(root.glob("*.py")):
              if path.name in excluded_files:
                  continue
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              found = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str) and korean.search(node.value):
                      value = node.value.replace("\n", "\\n")
                      found.append((getattr(node, "lineno", 0), value))
                  elif isinstance(node, ast.JoinedStr):
                      joined = "".join(
                          part.value if isinstance(part, ast.Constant) and isinstance(part.value, str) else "{...}"
                          for part in node.values
                      )
                      if korean.search(joined):
                          found.append((getattr(node, "lineno", 0), joined.replace("\n", "\\n")))
              if found:
                  lines.append(f"## {path.name} ({len(found)})")
                  for lineno, value in sorted(found):
                      lines.append(f"L{lineno}: {value}")
                  lines.append("")
                  total += len(found)
          header = [
              "# Remaining Korean string literals after i18n stage 3",
              "",
              "Excluded: i18n.py, parsers.py, tune_data.py (intentional canonical/source-language strings)",
              f"Total: {total}",
              "",
          ]
          Path("I18N_REMAINING_STAGE3.md").write_text("\n".join(header + lines), encoding="utf-8")
          print("Remaining Korean literals after stage 3:", total)
          '@ | Set-Content inventory_stage3.py -Encoding UTF8
          python inventory_stage3.py
          Remove-Item inventory_stage3.py -Force

      - name: Commit inventory
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add I18N_REMAINING_STAGE3.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Audit remaining i18n strings after stage 3"
            git push origin HEAD:v1.2-work
          }
