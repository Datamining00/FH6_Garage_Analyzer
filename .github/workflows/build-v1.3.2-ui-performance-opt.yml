name: Build FH6 Assistant v1.3.2 UI Performance Opt

on:
  push:
    branches:
      - v1.3.2-ui-performance-opt
    paths:
      - ".github/workflows/build-v1.3.2-ui-performance-opt.yml"
      - "source-v1.2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Patched MainWindow smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from fh6garage.ui import MainWindow
          from fh6garage.v1_3_ui_patch import apply_v1_3_ui_patches
          from fh6garage.v1_3_1_patch import apply_v1_3_1_patches
          from fh6garage.v1_3_2_patch import apply_v1_3_2_patches
          from fh6garage.v1_3_2_safety_patch import apply_v1_3_2_safety_patches
          from fh6garage.v1_3_2_startup_patch import apply_v1_3_2_startup_patches
          from fh6garage.v1_3_2_list_fix import apply_v1_3_2_list_fixes
          from fh6garage.v1_3_2_visibility_patch import apply_v1_3_2_visibility_patches
          from fh6garage.v1_3_2_ui_cleanup_patch import apply_v1_3_2_ui_cleanup_patch
          from fh6garage.v1_3_2_ui_followup_patch import apply_v1_3_2_ui_followup_patch
          from fh6garage.v1_3_2_manifest_registry_patch import apply_v1_3_2_manifest_registry_patch
          from fh6garage.v1_3_2_card_alignment_patch import apply_v1_3_2_card_alignment_patch
          from fh6garage.v1_3_2_ui_performance_patch import apply_v1_3_2_ui_performance_patches
          from fh6garage.v1_3_2_thread_affinity_patch import apply_v1_3_2_thread_affinity_fix

          apply_v1_3_ui_patches(MainWindow)
          apply_v1_3_1_patches(MainWindow)
          apply_v1_3_2_patches(MainWindow)
          apply_v1_3_2_safety_patches(MainWindow)
          apply_v1_3_2_startup_patches()
          apply_v1_3_2_list_fixes(MainWindow)
          apply_v1_3_2_visibility_patches(MainWindow)
          apply_v1_3_2_ui_cleanup_patch(MainWindow)
          apply_v1_3_2_ui_followup_patch(MainWindow)
          apply_v1_3_2_manifest_registry_patch(MainWindow)
          apply_v1_3_2_card_alignment_patch(MainWindow)
          apply_v1_3_2_ui_performance_patches(MainWindow)
          apply_v1_3_2_thread_affinity_fix(MainWindow)

          app = QApplication.instance() or QApplication([])
          window = MainWindow(project_root=Path.cwd())
          assert getattr(MainWindow, "_fh6_v132_ui_performance_patched", False)
          assert getattr(MainWindow, "_fh6_v132_thread_affinity_fixed", False)
          assert window.livery_table.isHidden()
          assert window.tuning_table.isHidden()
          window.close()
          print("optimized MainWindow + final thread-affinity patch ok")
          '@ | Set-Content -Path smoke_opt.py -Encoding UTF8
          python smoke_opt.py

      - name: Build single Windows EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) { throw "FH6 Assistant v1.3.2.exe was not created." }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) { throw "Built EXE is unexpectedly small: $size bytes" }
          Write-Host "Built EXE bytes: $size"

      - name: Smoke test bundled EXE startup responsiveness
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Bundled EXE exited during startup smoke test with code $($proc.ExitCode)." }
          if (-not $proc.Responding) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Bundled EXE is alive but Windows reports the GUI as Not Responding."
          }
          Write-Host "Optimized bundled EXE is alive and Responding after 8 seconds."
          Stop-Process -Id $proc.Id -Force

      - name: Prepare artifact and SHA-256
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe "artifact\FH6 Assistant v1.3.2 UI Performance Opt.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2 UI Performance Opt.exe" | Set-Content -Path "artifact\FH6 Assistant v1.3.2 UI Performance Opt.exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload optimized Windows build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Windows_v1.3.2_ui_performance_opt
          path: |
            artifact/FH6 Assistant v1.3.2 UI Performance Opt.exe
            artifact/FH6 Assistant v1.3.2 UI Performance Opt.exe.sha256
          if-no-files-found: error
          compression-level: 0
