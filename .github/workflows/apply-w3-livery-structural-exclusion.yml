name: Apply W3 structural livery exclusions

on:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - ".github/workflows/apply-w3-livery-structural-exclusion.yml"

permissions:
  contents: write

concurrency:
  group: apply-w3-livery-structural-exclusion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply exact structural livery exclusion patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("source-v1.2/fh6garage/preview3d/glb_parser.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _structural_livery_exclusion_reason(extras: dict) -> str:
              """Return strong scene evidence that a mesh cannot receive body livery."""
              part_type = str(extras.get("kfps_part_type") or "").strip().casefold()
              if part_type == "brakes":
                  return "part_type_brakes"

              source_entry = str(extras.get("kfps_source_entry") or "").replace("\\\\", "/").casefold()
              if "/scene/interior/" in f"/{source_entry.lstrip('/')}" :
                  return "scene_interior"
              return ""
          '''
          # Match the repository block without relying on PowerShell escaping.
          old = old.replace('}" :', '}":')
          new = '''def _structural_livery_exclusion_reason(extras: dict) -> str:
              """Return strong scene evidence that a mesh cannot receive body livery."""
              part_type = str(extras.get("kfps_part_type") or "").strip().casefold()
              if part_type == "brakes":
                  return "part_type_brakes"
              if part_type == "wheelstyle":
                  return "part_type_wheelstyle"

              source_entry = str(extras.get("kfps_source_entry") or "").replace("\\\\", "/").casefold()
              canonical_source = f"/{source_entry.lstrip('/')}"
              if "/scene/interior/" in canonical_source:
                  return "scene_interior"
              if "/scene/exterior/doors/doorjamb" in canonical_source:
                  return "exterior_door_jamb"
              if "/scene/exterior/platform/doorsill" in canonical_source:
                  return "exterior_door_sill"
              return ""
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one structural exclusion block, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          '@ | Set-Content -Encoding utf8 patch_structural_livery.py
          python patch_structural_livery.py
          if ($LASTEXITCODE -ne 0) { throw "Structural livery patch failed" }
          Remove-Item patch_structural_livery.py -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Compile and run focused regression
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/glb_parser.py
          python -m unittest tests.test_glb_livery_structural_exclusion -v
          python -m unittest discover -s tests -v

      - name: Commit verified source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2/fh6garage/preview3d/glb_parser.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "No glb_parser.py change was produced" }
          git commit -m "Exclude non-livery wheel and door support geometry"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:v1.4-rc1-wheel-morph-w3
          if ($LASTEXITCODE -ne 0) { throw "Push failed" }
