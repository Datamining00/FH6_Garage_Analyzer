name: Remove final FH6 Assistant i18n literals

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/fix-i18n-final-literals.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Remove final literals
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("source-v1.2/fh6garage/ui.py")
          text = path.read_text(encoding="utf-8")

          old = '(clean_note + "\\n\\n클릭하여 메모 수정")'
          new = '(clean_note + tr("memo.edit_suffix"))'
          if old not in text:
              raise SystemExit("Final memo tooltip literal was not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              "상태 | 차량명 | 제작자 | 이름 | 설명 | 메모 | 생성일 | 다운로드일",
              "Status | Vehicle | Creator | Name | Description | Memo | Created | Downloaded",
              1,
          )
          path.write_text(text, encoding="utf-8")
          '@ | Set-Content fix_final_i18n.py -Encoding UTF8
          python fix_final_i18n.py
          Remove-Item fix_final_i18n.py -Force

      - name: Compile and test
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2/fh6garage/ui.py
          git commit -m "Remove final untranslated UI literal"
          git push origin HEAD:v1.2-work
