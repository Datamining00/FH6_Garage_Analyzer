name: Clean generated FH6 Assistant v1.2 source artifacts

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/cleanup-v12-generated.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Remove generated Python bytecode
        shell: pwsh
        run: |
          Get-ChildItem -Path source-v1.2 -Directory -Recurse -Force |
            Where-Object { $_.Name -eq "__pycache__" } |
            Remove-Item -Recurse -Force
          Get-ChildItem -Path source-v1.2 -File -Recurse -Force -Include *.pyc,*.pyo |
            Remove-Item -Force

      - name: Commit clean source tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source-v1.2
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Remove generated bytecode from v1.2 source"
            git push origin HEAD:v1.2-work
          }
