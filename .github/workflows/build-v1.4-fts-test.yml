name: Validate and build FH6 Assistant v1.4 FTS test

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-forzatechstudio-transform
    paths:
      - "source-v1.2/**"
      - ".github/workflows/build-v1.4-fts-test.yml"

permissions:
  contents: read

concurrency:
  group: v14-fts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    name: Windows regression (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout FTS branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
          FH6_PREVIEW3D_GEOMETRY_MODE: forzatechstudio
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Verify tracked source unchanged
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=no
          if ($changes) {
            $changes | Write-Host
            throw "Regression tests altered tracked source files."
          }

  build:
    name: Standard Portable Source FTS test
    needs: windows-regression
    runs-on: windows-latest
    env:
      FH6_PREVIEW3D_GEOMETRY_MODE: forzatechstudio
    steps:
      - name: Checkout validated FTS branch
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Build Standard OneFile
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.4.exe"
          if (-not (Test-Path $exe)) { throw "Standard EXE was not created." }
          if ((Get-Item $exe).Length -lt 10000000) { throw "Standard EXE is unexpectedly small." }
      - name: Smoke test Standard
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $env:PYINSTALLER_STRICT_UNPACK_MODE = "1"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Standard EXE did not complete smoke test."
          }
          if ($proc.ExitCode -ne 0) { throw "Standard EXE exited with code $($proc.ExitCode)." }
      - name: Package Standard
        shell: pwsh
        run: |
          $dst = "package_standard\FH6 Assistant v1.4 FTS Test Standard"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4.exe"
          Copy-Item $exe "$dst\FH6 Assistant v1.4 FTS Test.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.4 FTS Test.exe" | Set-Content "$dst\SHA256.txt" -Encoding ascii
          Copy-Item "source-v1.2\README.txt" "$dst\README.txt" -Force
      - name: Build Portable OneDir
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4_portable.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.4 Portable\FH6 Assistant v1.4.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE was not created." }
      - name: Smoke test Portable
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4 Portable\FH6 Assistant v1.4.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Portable EXE did not complete smoke test."
          }
          if ($proc.ExitCode -ne 0) { throw "Portable EXE exited with code $($proc.ExitCode)." }
      - name: Package Portable
        shell: pwsh
        run: |
          $dst = "package_portable\FH6 Assistant v1.4 FTS Test Portable"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.4 Portable\*" $dst -Recurse -Force
          Copy-Item "source-v1.2\README.txt" "$dst\README.txt" -Force
      - name: Package Source
        shell: pwsh
        run: |
          $dst = "package_source\FH6 Assistant v1.4 FTS Test Source"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $files = @(
            "FH6 Assistant.vbs",
            "run.bat",
            "setup_and_run.ps1",
            "app.py",
            "requirements.txt",
            "README.txt",
            "version_info.txt",
            "build_exe.ps1",
            "FH6_Assistant_v1.4.spec",
            "FH6_Assistant_v1.4_portable.spec"
          )
          foreach ($file in $files) { Copy-Item "source-v1.2\$file" $dst -Force }
          foreach ($directory in @("data", "icons", "fh6garage", "tests")) {
            Copy-Item "source-v1.2\$directory" $dst -Recurse -Force
          }
          Get-ChildItem $dst -Directory -Recurse -Filter "__pycache__" | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem $dst -File -Recurse | Where-Object { $_.Extension -in @(".pyc", ".pyo") } | Remove-Item -Force
      - name: Smoke test Source
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $work = Resolve-Path "package_source\FH6 Assistant v1.4 FTS Test Source"
          $proc = Start-Process -FilePath python -ArgumentList '-B','app.py' -WorkingDirectory $work -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Source app.py did not complete smoke test."
          }
          if ($proc.ExitCode -ne 0) { throw "Source app.py exited with code $($proc.ExitCode)." }
      - name: Upload Standard FTS test
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_FTS_Test_Standard
          path: package_standard/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Portable FTS test
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_FTS_Test_Portable
          path: package_portable/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Upload Source FTS test
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_FTS_Test_Source
          path: package_source/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
