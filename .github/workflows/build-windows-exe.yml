name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download current v1.0 source package
        shell: pwsh
        run: |
          $url = "https://github.com/Datamining00/FH6_Garage_Analyzer/releases/download/FH6_Assistant/FH6_Assistant_v1.0.zip"
          Invoke-WebRequest -Uri $url -OutFile source.zip
          Expand-Archive -Path source.zip -DestinationPath source -Force

          $app = Get-ChildItem -Path source -Filter app.py -Recurse | Select-Object -First 1
          if (-not $app) { throw "app.py was not found in the release archive." }

          $appDir = $app.Directory.FullName
          if (-not (Test-Path (Join-Path $appDir "requirements.txt"))) { throw "requirements.txt was not found next to app.py." }
          if (-not (Test-Path (Join-Path $appDir "data\car_names.json"))) { throw "data\car_names.json was not found." }
          if (-not (Test-Path (Join-Path $appDir "icons\icon_A_garage.ico"))) { throw "icons\icon_A_garage.ico was not found." }
          if (-not (Test-Path (Join-Path $appDir "fh6garage\ui.py"))) { throw "fh6garage\ui.py was not found." }

          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch initial thumbnail refresh
        shell: pwsh
        run: |
          $patchScript = @'
          from pathlib import Path

          p = Path("fh6garage/ui.py")
          s = p.read_text(encoding="utf-8")

          old = """        self.pages = QStackedWidget()\n        self.pages.addWidget(self._dashboard_page())\n        self.pages.addWidget(self._livery_page())\n        self.pages.addWidget(self._tuning_page())\n        content_layout.addWidget(self.pages, 1)\n"""
          new = """        self.pages = QStackedWidget()\n        self.pages.addWidget(self._dashboard_page())\n        self.pages.addWidget(self._livery_page())\n        self.pages.addWidget(self._tuning_page())\n        self.pages.currentChanged.connect(self._on_main_page_changed)\n        content_layout.addWidget(self.pages, 1)\n"""
          if old not in s:
              raise SystemExit("QStackedWidget initialization block was not found")
          s = s.replace(old, new, 1)

          anchor = """    def _schedule_visible_livery_thumbnails(self) -> None:\n        QTimer.singleShot(0, self._refresh_visible_livery_thumbnails)\n"""
          insert = """    @Slot(int)\n    def _on_main_page_changed(self, index: int) -> None:\n        if index == 1:\n            QTimer.singleShot(0, self._sync_livery_grid_card_widths)\n            QTimer.singleShot(0, self._refresh_visible_livery_thumbnails)\n            QTimer.singleShot(30, self._refresh_visible_livery_thumbnails)\n        elif index == 2:\n            QTimer.singleShot(0, self._sync_tuning_grid_card_widths)\n            QTimer.singleShot(0, self._refresh_visible_tuning_thumbnails)\n            QTimer.singleShot(30, self._refresh_visible_tuning_thumbnails)\n\n    def _schedule_visible_livery_thumbnails(self) -> None:\n        QTimer.singleShot(0, self._refresh_visible_livery_thumbnails)\n"""
          if anchor not in s:
              raise SystemExit("thumbnail scheduling method was not found")
          s = s.replace(anchor, insert, 1)

          p.write_text(s, encoding="utf-8")
          '@

          Set-Location $env:APP_DIR
          $patchScript | Set-Content -Path patch_thumbnails.py -Encoding UTF8
          python patch_thumbnails.py
          Remove-Item patch_thumbnails.py
          python -m compileall -q .

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Build FH6 Assistant
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "FH6 Assistant" `
            --icon "icons\icon_A_garage.ico" `
            --add-data "data:data" `
            app.py

          $exe = Join-Path $env:APP_DIR "dist\FH6 Assistant\FH6 Assistant.exe"
          if (-not (Test-Path $exe)) { throw "FH6 Assistant.exe was not created." }

      - name: Prepare artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "artifact\FH6 Assistant"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -Path (Join-Path $env:APP_DIR "dist\FH6 Assistant\*") -Destination $output -Recurse -Force

          @"
          FH6 Assistant
          =============

          FH6 Assistant.exe를 실행하면 됩니다.

          별도의 Python 또는 PySide6 설치가 필요하지 않습니다.
          run.bat 및 VBS 파일도 필요하지 않습니다.

          프로그램 설정과 메모는 기존과 동일하게
          %LOCALAPPDATA%\FH6GarageAnalyzer 에 저장됩니다.
          "@ | Set-Content -Path (Join-Path $output "README.txt") -Encoding UTF8

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Windows_v1.0
          path: artifact/FH6 Assistant
          if-no-files-found: error
          compression-level: 9
