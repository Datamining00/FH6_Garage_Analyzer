name: Materialize FH6 Assistant v1.1 source

on:
  workflow_dispatch:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download exact v1.0 source package
        shell: pwsh
        run: |
          $url = "https://github.com/Datamining00/FH6_Garage_Analyzer/releases/download/FH6_Assistant/FH6_Assistant_v1.0.zip"
          Invoke-WebRequest -Uri $url -OutFile source.zip

          $expected = "048b440aacb7787354292f954d0408b9fdd57be36078cdc66beeaa7c3eab1f72"
          $actual = (Get-FileHash source.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "v1.0 source digest mismatch. Expected $expected, got $actual"
          }

          Expand-Archive -Path source.zip -DestinationPath source -Force
          $app = Get-ChildItem -Path source -Filter app.py -Recurse | Select-Object -First 1
          if (-not $app) { throw "app.py was not found in the v1.0 release archive." }
          "APP_DIR=$($app.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reconstruct v1.1 patch and icon
        shell: pwsh
        run: |
          @'
          import base64
          import gzip
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          app_dir = Path(os.environ["APP_DIR"])
          asset_dir = workspace / ".github" / "build-assets" / "v1.1"

          def decode_parts(prefix: str) -> bytes:
              parts = sorted(asset_dir.glob(prefix + ".part*"))
              if not parts:
                  raise RuntimeError(f"No build asset parts found for {prefix}")
              encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
              return gzip.decompress(base64.b64decode(encoded))

          patch = decode_parts("patch")
          icon = decode_parts("icon64")
          (workspace / "v1.1.patch").write_bytes(patch)
          (app_dir / "icons" / "FH6_Assistant.ico").write_bytes(icon)

          if len(patch) < 60000:
              raise RuntimeError(f"Reconstructed patch is unexpectedly small: {len(patch)}")
          if len(icon) < 6000 or icon[:4] != b"\x00\x00\x01\x00":
              raise RuntimeError("Reconstructed FH6_Assistant.ico is invalid")
          print(f"Patch bytes: {len(patch)}")
          print(f"Icon bytes: {len(icon)}")
          '@ | Set-Content -Path reconstruct_assets.py -Encoding UTF8
          python reconstruct_assets.py

      - name: Apply and validate final v1.1 source
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          git apply (Join-Path $env:GITHUB_WORKSPACE "v1.1.patch")

          if (Test-Path "fh6garage\thumbnail_labeler.py") {
            throw "Obsolete thumbnail write module still exists after applying the v1.1 patch."
          }

          python -m compileall -q .
          python -c "import json,pathlib; d=json.loads(pathlib.Path('data/car_names.json').read_text(encoding='utf-8')); cars=d.get('cars',{}); assert d.get('count')==660; assert len(cars)==660; print('Embedded car database:', len(cars), 'entries')"

          if (-not (Select-String -Path "fh6garage\ui.py" -Pattern "FH6 Assistant v1.1" -Quiet)) {
            throw "v1.1 window title was not found in ui.py."
          }
          if (-not (Test-Path "FH6_Assistant_v1.1.spec")) { throw "FH6_Assistant_v1.1.spec was not created." }
          if (-not (Test-Path "version_info.txt")) { throw "version_info.txt was not created." }

          Get-ChildItem -Path . -Directory -Recurse -Force | Where-Object { $_.Name -eq "__pycache__" } | Remove-Item -Recurse -Force

      - name: Commit reconstructed source snapshot
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $dest = Join-Path $workspace "source-v1.1"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          Get-ChildItem -Path $env:APP_DIR -Force | ForEach-Object {
            if ($_.Name -notin @('.git', '.venv', 'build', 'dist', '__pycache__')) {
              Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
            }
          }

          Get-ChildItem -Path $dest -Directory -Recurse -Force | Where-Object { $_.Name -eq "__pycache__" } | Remove-Item -Recurse -Force

          $manifest = Get-ChildItem -Path $dest -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($dest.Length + 1).Replace('\\','/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $relative"
          }
          $manifest | Set-Content -Path (Join-Path $workspace "SOURCE_BASELINE_v1.1.sha256") -Encoding ascii

          @(
            "FH6 Assistant v1.1 reconstructed source baseline",
            "Base release asset: FH6_Assistant_v1.0.zip",
            "Base SHA-256: 048b440aacb7787354292f954d0408b9fdd57be36078cdc66beeaa7c3eab1f72",
            "Applied patch: .github/build-assets/v1.1/patch.part*",
            "Applied icon: .github/build-assets/v1.1/icon64.part*"
          ) | Set-Content -Path (Join-Path $workspace "SOURCE_BASELINE_v1.1.txt") -Encoding utf8

          Set-Location $workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.1 SOURCE_BASELINE_v1.1.txt SOURCE_BASELINE_v1.1.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add reconstructed FH6 Assistant v1.1 source baseline"
            git push origin HEAD:v1.2-work
          } else {
            Write-Host "No source changes to commit."
          }
