name: Validate FH6 Assistant v1.2 work source

on:
  workflow_dispatch:
  push:
    branches:
      - v1.2-work
    paths:
      - "source-v1.2/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile all Python source
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .

      - name: Validate bundled car database
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -c "import json,pathlib; d=json.loads(pathlib.Path('data/car_names.json').read_text(encoding='utf-8')); cars=d.get('cars',{}); assert d.get('count')==660; assert len(cars)==660; assert '1229' in cars; print('Embedded car database:', len(cars), 'entries'); print('CarOrdinal 1229:', cars['1229'])"

      - name: Run v1.2 regression tests
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

      - name: Verify v1.1 source baseline remains untouched
        shell: pwsh
        run: |
          $expected = "757cf0349b9b2240273c99f892497e3f89438333"
          $actual = (git rev-parse "HEAD:source-v1.1").Trim()
          if ($actual -ne $expected) {
            throw "v1.1 baseline tree changed. Expected $expected, got $actual"
          }
          Write-Host "v1.1 baseline tree preserved: $actual"
