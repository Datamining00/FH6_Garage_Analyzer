name: CI-only FH6 Assistant v1.3.2 Performance Build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "source-v1.2/**"

permissions:
  contents: read

jobs:
  build-performance:
    runs-on: windows-latest

    steps:
      - name: Checkout performance PR
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run full regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Performance patch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -c "from PySide6.QtWidgets import QApplication, QToolBar; from fh6garage.ui import MainWindow; from fh6garage.v1_3_ui_patch import apply_v1_3_ui_patches; from fh6garage.v1_3_1_patch import apply_v1_3_1_patches; from fh6garage.v1_3_2_patch import apply_v1_3_2_patches; from fh6garage.v1_3_2_safety_patch import apply_v1_3_2_safety_patches; from fh6garage.v1_3_2_startup_patch import apply_v1_3_2_startup_patches; from fh6garage.v1_3_2_list_fix import apply_v1_3_2_list_fixes; from fh6garage.v1_3_2_visibility_patch import apply_v1_3_2_visibility_patches; from fh6garage.v1_3_2_ui_cleanup_patch import apply_v1_3_2_ui_cleanup_patch; from fh6garage.v1_3_2_ui_followup_patch import apply_v1_3_2_ui_followup_patch; from fh6garage.v1_3_2_manifest_registry_patch import apply_v1_3_2_manifest_registry_patch; from fh6garage.v1_3_2_card_alignment_patch import apply_v1_3_2_card_alignment_patch; from fh6garage.v1_3_2_performance_patch import apply_v1_3_2_performance_patches; from fh6garage.v1_3_2_thread_affinity_patch import apply_v1_3_2_thread_affinity_fix; apply_v1_3_ui_patches(MainWindow); apply_v1_3_1_patches(MainWindow); apply_v1_3_2_patches(MainWindow); apply_v1_3_2_safety_patches(MainWindow); apply_v1_3_2_startup_patches(); apply_v1_3_2_list_fixes(MainWindow); apply_v1_3_2_visibility_patches(MainWindow); apply_v1_3_2_ui_cleanup_patch(MainWindow); apply_v1_3_2_ui_followup_patch(MainWindow); apply_v1_3_2_manifest_registry_patch(MainWindow); apply_v1_3_2_card_alignment_patch(MainWindow); apply_v1_3_2_performance_patches(MainWindow); apply_v1_3_2_thread_affinity_fix(MainWindow); app=QApplication.instance() or QApplication([]); w=MainWindow(project_root=__import__('pathlib').Path.cwd()); assert w.findChild(QToolBar, 'performanceDiagnosticsToolbar') is not None; w.close(); print('performance toolbar and final thread-affinity patch ok')"

      - name: Build single Windows EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) { throw "FH6 Assistant v1.3.2.exe was not created." }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) { throw "Built EXE is unexpectedly small: $size bytes" }
          Write-Host "Built EXE bytes: $size"

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $version = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion: $($version.FileVersion)"
          Write-Host "ProductVersion: $($version.ProductVersion)"
          Write-Host "OriginalFilename: $($version.OriginalFilename)"
          if (-not $version.FileVersion.StartsWith("1.3.2")) { throw "Unexpected FileVersion: $($version.FileVersion)" }
          if (-not $version.ProductVersion.StartsWith("1.3.2")) { throw "Unexpected ProductVersion: $($version.ProductVersion)" }
          if ($version.OriginalFilename -ne "FH6 Assistant v1.3.2.exe") { throw "Unexpected OriginalFilename: $($version.OriginalFilename)" }

      - name: Smoke test bundled EXE startup responsiveness
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Bundled EXE exited during startup smoke test with code $($proc.ExitCode)." }
          if (-not $proc.Responding) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Bundled EXE is alive but Windows reports the GUI as Not Responding."
          }
          Write-Host "Bundled performance EXE is alive and Responding after 8 seconds."
          Stop-Process -Id $proc.Id -Force

      - name: Prepare artifact and SHA-256
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe "artifact\FH6 Assistant v1.3.2 Performance.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2 Performance.exe" | Set-Content -Path "artifact\FH6 Assistant v1.3.2 Performance.exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload Windows performance build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_Windows_v1.3.2_performance
          path: |
            artifact/FH6 Assistant v1.3.2 Performance.exe
            artifact/FH6 Assistant v1.3.2 Performance.exe.sha256
          if-no-files-found: error
          compression-level: 0
