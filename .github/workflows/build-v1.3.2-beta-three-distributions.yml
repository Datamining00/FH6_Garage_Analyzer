name: Validate and build FH6 Assistant v1.3.2 candidates

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3.2-adaptive-performance-refactor
      - v1.3.2-memory-applied-state-integration
    paths:
      - "source-v1.2/**"
      - ".github/workflows/build-v1.3.2-beta-three-distributions.yml"
  pull_request:
    branches:
      - v1.3.2-adaptive-performance-refactor
      - v1.3.2-memory-applied-state-integration
    paths:
      - "source-v1.2/**"
      - ".github/workflows/build-v1.3.2-beta-three-distributions.yml"

permissions:
  contents: read

concurrency:
  group: v132-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    name: Windows regression (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout current source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and run complete regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Verify tests did not alter tracked source
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=no
          if ($changes) {
            $changes | Write-Host
            throw "Regression tests altered tracked source files."
          }

  build-candidates:
    name: Standard, Portable, and Source candidates
    needs: windows-regression
    runs-on: windows-latest

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Verify Source distribution inputs
        shell: pwsh
        run: |
          $required = @(
            "source-v1.2\FH6 Assistant.vbs",
            "source-v1.2\run.bat",
            "source-v1.2\setup_and_run.ps1",
            "source-v1.2\app.py",
            "source-v1.2\requirements.txt",
            "source-v1.2\README.txt",
            "source-v1.2\version_info.txt",
            "source-v1.2\FH6_Assistant_v1.3.2.spec",
            "source-v1.2\FH6_Assistant_v1.3.2_portable.spec"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required Source distribution file is missing: $path"
            }
          }

      - name: Build Standard (OneFile)
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) { throw "Standard EXE was not created." }
          if ((Get-Item $exe).Length -lt 10000000) {
            throw "Standard EXE is unexpectedly small."
          }

      - name: Execute Standard and verify clean OneFile shutdown
        shell: pwsh
        run: |
          $before = @(
            Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue |
              ForEach-Object FullName
          )
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $env:PYINSTALLER_STRICT_UNPACK_MODE = "1"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Standard EXE did not complete its graceful startup/close smoke test."
          }
          if ($proc.ExitCode -ne 0) {
            throw "Standard EXE exited with code $($proc.ExitCode)."
          }
          Start-Sleep -Seconds 2
          $leftovers = @(
            Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notin $before }
          )
          if ($leftovers.Count -gt 0) {
            $leftovers.FullName | Write-Host
            throw "Standard EXE left a new PyInstaller extraction directory."
          }

      - name: Package Standard candidate
        shell: pwsh
        run: |
          $dst = "package_standard\FH6 Assistant v1.3.2 Standard"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          Copy-Item $exe "$dst\FH6 Assistant v1.3.2.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.3.2.exe" |
            Set-Content "$dst\SHA256.txt" -Encoding ascii
          @"
          FH6 Assistant v1.3.2 - Standard candidate

          Single-file Windows build. Python installation is not required.
          If OneFile extraction is blocked on a PC, use Portable; Source is the
          final fallback for a compatible local Python installation.

          Candidate notice: do not publish until real FH6 save validation is signed off.
          "@ | Set-Content "$dst\README.txt" -Encoding utf8

      - name: Build Portable (OneDir)
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2_portable.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE was not created." }

      - name: Execute Portable with graceful shutdown
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Portable EXE did not complete its graceful startup/close smoke test."
          }
          if ($proc.ExitCode -ne 0) {
            throw "Portable EXE exited with code $($proc.ExitCode)."
          }

      - name: Package Portable candidate
        shell: pwsh
        run: |
          $dst = "package_portable\FH6 Assistant v1.3.2 Portable"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.3.2 Portable\*" $dst -Recurse -Force
          @"
          FH6 Assistant v1.3.2 - Portable candidate

          Folder-based Windows build. Python installation is not required.
          Keep the executable and the complete _internal folder together.

          Candidate notice: do not publish until real FH6 save validation is signed off.
          "@ | Set-Content "$dst\README.txt" -Encoding utf8
          $root = (Resolve-Path $dst).Path
          $lines = foreach ($file in Get-ChildItem $dst -File -Recurse | Sort-Object FullName) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = $file.FullName.Substring($root.Length + 1)
            "$hash  $relative"
          }
          $lines | Set-Content "$dst\FILES_SHA256.txt" -Encoding ascii

      - name: Package Source candidate
        shell: pwsh
        run: |
          $dst = "package_source\FH6 Assistant v1.3.2 Source"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $files = @(
            "FH6 Assistant.vbs",
            "run.bat",
            "setup_and_run.ps1",
            "app.py",
            "requirements.txt",
            "README.txt",
            "version_info.txt",
            "build_exe.ps1",
            "FH6_Assistant_v1.3.2.spec",
            "FH6_Assistant_v1.3.2_portable.spec"
          )
          foreach ($file in $files) {
            Copy-Item "source-v1.2\$file" $dst -Force
          }
          foreach ($directory in @("data", "icons", "fh6garage", "tests")) {
            Copy-Item "source-v1.2\$directory" $dst -Recurse -Force
          }
          Get-ChildItem $dst -Directory -Recurse -Filter "__pycache__" |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force
          Get-ChildItem $dst -File -Recurse |
            Where-Object { $_.Extension -in @(".pyc", ".pyo") } |
            Remove-Item -Force
          $bytecode = @(
            Get-ChildItem $dst -File -Recurse |
              Where-Object {
                $_.Extension -in @(".pyc", ".pyo") -or
                $_.DirectoryName -match "[\\/]__pycache__([\\/]|$)"
              }
          )
          if ($bytecode.Count -gt 0) {
            throw "Source package contains generated Python bytecode."
          }
          @"
          FH6 Assistant v1.3.2 - Source candidate

          Normal launch: double-click FH6 Assistant.vbs.
          Diagnostic launch: run run.bat to keep errors visible.
          The launcher creates/reuses its Python environment under
          %LOCALAPPDATA%\FH6GarageAnalyzer\venv and never writes into FH6 saves.

          Candidate notice: do not publish until real FH6 save validation is signed off.
          "@ | Set-Content "$dst\README_SOURCE.txt" -Encoding utf8
          $root = (Resolve-Path $dst).Path
          $lines = foreach ($file in Get-ChildItem $dst -File -Recurse | Sort-Object FullName) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = $file.FullName.Substring($root.Length + 1)
            "$hash  $relative"
          }
          $lines | Set-Content "$dst\FILES_SHA256.txt" -Encoding ascii

      - name: Execute Source with graceful shutdown
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $work = Resolve-Path "package_source\FH6 Assistant v1.3.2 Source"
          $proc = Start-Process -FilePath python -ArgumentList '-B','app.py' -WorkingDirectory $work -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Source app.py did not complete its graceful startup/close smoke test."
          }
          if ($proc.ExitCode -ne 0) {
            throw "Source app.py exited with code $($proc.ExitCode)."
          }

      - name: Upload Standard candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Candidate_Standard
          path: package_standard/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Portable candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Candidate_Portable
          path: package_portable/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Source candidate
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Candidate_Source
          path: package_source/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
