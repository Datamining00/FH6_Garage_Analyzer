name: Validate v1.3.2 Alias Final UI

on:
  push:
    branches:
      - v1.3.2-auction-unapplied-recent-frame
    paths:
      - "source-v1.2/**"
      - ".github/workflows/validate-v1.3.2-alias-final.yml"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller
      - name: Regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build OneFile
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2.spec
      - name: Smoke OneFile
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "OneFile exited: $($proc.ExitCode)" }
          if (-not $proc.Responding) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "OneFile not responding" }
          Stop-Process -Id $proc.Id -Force
      - name: Package OneFile
        shell: pwsh
        run: |
          $dst = "package_onefile\FH6 Assistant v1.3.2 Standard"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.3.2.exe" "$dst\FH6 Assistant v1.3.2.exe"
          (Get-FileHash "$dst\FH6 Assistant v1.3.2.exe" -Algorithm SHA256).Hash.ToLower() | Set-Content "$dst\EXE_SHA256.txt" -Encoding ascii
      - name: Build OneDir
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.3.2_portable.spec
      - name: Smoke OneDir
        shell: pwsh
        run: |
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.3.2 Portable\FH6 Assistant v1.3.2.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "OneDir exited: $($proc.ExitCode)" }
          if (-not $proc.Responding) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "OneDir not responding" }
          Stop-Process -Id $proc.Id -Force
      - name: Package OneDir
        shell: pwsh
        run: |
          $dst = "package_onedir\FH6 Assistant v1.3.2 Portable"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.3.2 Portable\*" $dst -Recurse -Force
          (Get-FileHash "$dst\FH6 Assistant v1.3.2.exe" -Algorithm SHA256).Hash.ToLower() | Set-Content "$dst\EXE_SHA256.txt" -Encoding ascii
      - name: Package Source
        shell: pwsh
        run: |
          $dst = "package_source\FH6 Assistant v1.3.2 Source"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\app.py" $dst
          Copy-Item "source-v1.2\run.bat" $dst
          Copy-Item "source-v1.2\FH6 Assistant.vbs" $dst
          Copy-Item "source-v1.2\requirements.txt" $dst
          Copy-Item "source-v1.2\README.txt" $dst
          Copy-Item "source-v1.2\data" $dst -Recurse
          Copy-Item "source-v1.2\icons" $dst -Recurse
          Copy-Item "source-v1.2\fh6garage" $dst -Recurse
          Get-ChildItem $dst -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem $dst -Recurse -File -Filter *.pyc | Remove-Item -Force
      - name: Smoke Source
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $work = Resolve-Path "package_source\FH6 Assistant v1.3.2 Source"
          $proc = Start-Process -FilePath python -ArgumentList '-B','app.py' -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 6
          $proc.Refresh()
          if ($proc.HasExited) { throw "Source exited: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Standard_AliasManagerFinal
          path: package_onefile/*
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Portable_AliasManagerFinal
          path: package_onedir/*
          compression-level: 6
      - uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.3.2_Source_AliasManagerFinal
          path: package_source/*
          compression-level: 6
