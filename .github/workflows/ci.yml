name: v1.5 Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: verified-build-requirements.txt
      - run: python -m pip install -r verified-build-requirements.txt
      - name: Verify committed vehicle data
        run: python -c "from pathlib import Path; import json; files=list(Path('source-v1.2/data/fh6_assistant_vehicle_data/cars').glob('*.json')); assert files; [json.loads(p.read_text(encoding='utf-8-sig')) for p in files]"
      - run: python source-v1.2/tools/run_isolated_tests.py
      - run: git diff --check
