name: Test independent C_livery decoder

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-independent-clivery-decoder
    paths:
      - ".github/workflows/test-independent-clivery-decoder.yml"
      - "source-v1.2/fh6garage/fh6_clivery/**"
      - "source-v1.2/tests/test_clivery_*.py"
      - "source-v1.2/tests/test_real_livery_regressions.py"
  pull_request:
    branches:
      - v1.4-baseline-warning-render
    paths:
      - ".github/workflows/test-independent-clivery-decoder.yml"
      - "source-v1.2/fh6garage/fh6_clivery/**"
      - "source-v1.2/tests/test_clivery_*.py"
      - "source-v1.2/tests/test_real_livery_regressions.py"

permissions:
  contents: read

jobs:
  independent-decoder:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile independent decoder
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q fh6garage/fh6_clivery

      - name: Run Milestone 1 tests without KFPS or FLS
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -p "test_clivery_*.py" -v
          python -m unittest discover -s tests -p "test_real_livery_regressions.py" -v

  existing-regressions:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vendor baseline KFPS dependencies for unchanged legacy tests
        shell: pwsh
        run: |
          $expected = "8965780b8966e09d2f2a17e4d0684cdd44d7437c"
          $vendor = Join-Path $PWD "source-v1.2\vendor\kfps"
          if (Test-Path $vendor) {
            Remove-Item $vendor -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $vendor) | Out-Null

          git clone --filter=blob:none --no-checkout https://github.com/heyitshestia/kloudys-forza-painter-suite.git $vendor
          git -C $vendor sparse-checkout init --no-cone
          @'
          /json_preview_renderer.py
          /geometry_json.py
          /LICENSE
          /tools/cgroup/
          /tools/livery/
          /tools/fabric-editor/shape-words.json
          /tools/fabric-editor/shape-names.json
          /tools/fabric-editor/Resources/Vinyls/
          '@ | Set-Content -Path (Join-Path $vendor ".git\info\sparse-checkout") -Encoding ascii
          git -C $vendor fetch --depth 1 origin $expected
          git -C $vendor checkout --detach FETCH_HEAD

          $actual = (git -C $vendor rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Unexpected KFPS vendor commit: $actual"
          }

      - name: Install existing application dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run existing regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v
