name: Apply FinalVerify1 3D UI polish

on:
  push:
    branches:
      - v1.4-rc1-finalverify1-ui-transfer

permissions:
  contents: write

jobs:
  apply-ui-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v4

      - name: Rebuild and verify UI patch
        shell: bash
        run: |
          cat .transfer/finalverify1-ui/*.part > "$RUNNER_TEMP/finalverify1-ui.patch"
          echo "890a3f863263f0875b85290883882dff7b2f465f01b3a3f2186ee3281817609b  $RUNNER_TEMP/finalverify1-ui.patch" | sha256sum -c -

      - name: Checkout validated target branch
        uses: actions/checkout@v4
        with:
          ref: v1.4-rc1-finalverify1-port
          path: target
          fetch-depth: 0

      - name: Apply UI-only patch and verify scope
        shell: bash
        run: |
          cd target
          test "$(git rev-parse HEAD)" = "6ce69ef7254ff927b1115fc5b6d3dafb4cf80478"
          git apply --check --directory=source-v1.2 "$RUNNER_TEMP/finalverify1-ui.patch"
          git apply --directory=source-v1.2 "$RUNNER_TEMP/finalverify1-ui.patch"
          python -m py_compile \
            source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py \
            source-v1.2/fh6garage/preview3d/integration.py \
            source-v1.2/fh6garage/preview3d/glb_viewer.py
          grep -n "test_3d_loading_ui_has_real_progress" source-v1.2/tests/test_v1_4_finalverify1_preview_port.py
          cd source-v1.2
          python -m unittest discover -s tests -p 'test_v1_4_finalverify1_preview_port.py' -v
          cd ..
          echo 'Changed files:'
          git diff --name-only
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'source-v1.2/fh6garage/preview3d/glb_viewer.py' \
            'source-v1.2/fh6garage/preview3d/integration.py' \
            'source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py' \
            'source-v1.2/tests/test_v1_4_finalverify1_preview_port.py' | sort)"
          test "$actual" = "$expected"

      - name: Commit clean UI update to target branch
        shell: bash
        run: |
          cd target
          git config user.name "FH6 RC1 UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add source-v1.2/fh6garage/preview3d/glb_viewer.py \
                  source-v1.2/fh6garage/preview3d/integration.py \
                  source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py \
                  source-v1.2/tests/test_v1_4_finalverify1_preview_port.py
          git commit -m "Polish FinalVerify1 3D loading UI and progress"
          git push origin HEAD:v1.4-rc1-finalverify1-port
