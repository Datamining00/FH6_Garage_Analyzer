name: Build FH6 Assistant v1.4 Wheel Morph W3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/FH6_Assistant_v1.4.spec"
      - "source-v1.2/FH6_Assistant_v1.4_portable.spec"
      - "source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py"
      - "source-v1.2/fh6garage/preview3d/__init__.py"
      - "source-v1.2/fh6garage/preview3d/chassis_converter.py"
      - "source-v1.2/fh6garage/preview3d/glb_parser.py"
      - "source-v1.2/fh6garage/preview3d/glb_viewer.py"
