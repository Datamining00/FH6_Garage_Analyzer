name: Build FH6 Assistant v1.4 Wheel Morph W3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/FH6_Assistant_v1.4.spec"
      - "source-v1.2/FH6_Assistant_v1.4_portable.spec"
      - "source-v1.2/fh6garage/v1_4_finalverify1_preview_patch.py"
      - "source-v1.2/fh6garage/preview3d/chassis_converter.py"
      - "source-v1.2/fh6garage/preview3d/glb_parser.py"
      - "source-v1.2/fh6garage/preview3d/tire_asset.py"
      - "source-v1.2/fh6garage/preview3d/tire_preview_integration.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_policy.py"
      - "source-v1.2/fh6garage/preview3d/tire_production_trial_geometry.py"
      - "source-v1.2/fh6garage/preview3d/tire_spindle_attachment.py"
      - "source-v1.2/fh6garage/preview3d/tire_spindle_glb_merge.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_auto.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_helper.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_runtime.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_weights.py"
      - "source-v1.2/fh6garage/preview3d/wheel_spec.py"
      - "source-v1.2/fh6garage/preview3d/wheel_spec_database.py"
      - "source-v1.2/tests/test_chassis_converter_auto_rim_morph.py"
      - "source-v1.2/tests/test_chassis_converter_wheel_morph_helper.py"
      - "source-v1.2/tests/test_glb_livery_structural_exclusion.py"
      - "source-v1.2/tests/test_tire_preview_integration.py"
      - "source-v1.2/tests/test_tire_production_policy.py"
      - "source-v1.2/tests/test_tire_production_trial_geometry.py"
      - "source-v1.2/tests/test_tire_spindle_attachment.py"
      - "source-v1.2/tests/test_tire_spindle_glb_merge.py"
      - "source-v1.2/tests/test_wheel_morph_auto.py"
      - "source-v1.2/tests/test_wheel_morph_helper.py"
      - "source-v1.2/tests/test_wheel_morph_runtime.py"
      - "source-v1.2/tests/test_wheel_spec_database.py"
      - "source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py"
      - "source-v1.2/tools/kfps_wheel_morph/WheelMorphDiagnostic.cs"
      - ".github/workflows/build-v1.4-wheel-morph-w3.yml"

permissions:
  contents: read

concurrency:
  group: v14-wheel-morph-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standard and Portable with verified rim/native tire preview
    runs-on: windows-latest

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Validate production rim and native tire preview before packaging
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/v1_4_finalverify1_preview_patch.py
          python -m py_compile fh6garage/preview3d/glb_parser.py
          python -m py_compile fh6garage/preview3d/wheel_spec_database.py
          python -m py_compile fh6garage/preview3d/wheel_morph_auto.py
          python -m py_compile fh6garage/preview3d/chassis_converter.py
          python -m py_compile fh6garage/preview3d/tire_preview_integration.py
          python -m py_compile fh6garage/preview3d/tire_production_policy.py
          python -m py_compile fh6garage/preview3d/tire_production_trial_geometry.py
          python -m py_compile fh6garage/preview3d/tire_spindle_attachment.py
          python -m py_compile fh6garage/preview3d/tire_spindle_glb_merge.py
          python -m unittest tests.test_glb_livery_structural_exclusion -v
          python -m unittest tests.test_wheel_spec_database -v
          python -m unittest tests.test_wheel_morph_auto -v
          python -m unittest tests.test_chassis_converter_wheel_morph_helper -v
          python -m unittest tests.test_chassis_converter_auto_rim_morph -v
          python -m unittest tests.test_tire_preview_integration -v
          python -m unittest tests.test_tire_production_policy -v
          python -m unittest tests.test_tire_production_trial_geometry -v
          python -m unittest tests.test_tire_spindle_attachment -v
          python -m unittest tests.test_tire_spindle_glb_merge -v

      - name: Validate helper locator contract
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/wheel_morph_helper.py
          python -m unittest tests.test_wheel_morph_helper -v

      - name: Checkout pinned KFPS source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/heyitshestia/kloudys-forza-painter-suite.git kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS clone failed with exit code $LASTEXITCODE" }
          git -C kfps-source checkout --detach 6f53ca3c584d78659d06d4b4a39561db67d79345
          if ($LASTEXITCODE -ne 0) { throw "Pinned KFPS checkout failed with exit code $LASTEXITCODE" }
          $actual = (git -C kfps-source rev-parse HEAD).Trim()
          if ($actual -ne "6f53ca3c584d78659d06d4b4a39561db67d79345") { throw "Pinned KFPS commit mismatch: $actual" }

      - name: Apply verified W3 rim morph patch
        shell: pwsh
        run: |
          python source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "Wheel morph patcher failed with exit code $LASTEXITCODE" }
          git -C kfps-source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched KFPS diff check failed with exit code $LASTEXITCODE" }
          $program = "kfps-source/tools/livery/chassis-converter/Program.cs"
          if (-not (Select-String -Path $program -SimpleMatch "WheelMorphRuntime.Configure(instances)" -Quiet)) { throw "Patched Program.cs is missing WheelMorphRuntime.Configure." }
          if (-not (Select-String -Path $program -SimpleMatch "wheel_morph_applied_meshes = WheelMorphRuntime.AppliedMeshes" -Quiet)) { throw "Patched Program.cs is missing rim morph diagnostics." }

      - name: Publish and stage verified helper
        shell: pwsh
        run: |
          dotnet publish kfps-source/tools/livery/chassis-converter/Kfps.ChassisConverter.csproj -c Release -o wheel-morph-converter
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic converter publish failed with exit code $LASTEXITCODE" }
          $built = Resolve-Path "wheel-morph-converter/Kfps.ChassisConverter.exe"
          $hash = (Get-FileHash $built -Algorithm SHA256).Hash.ToLower()
          $expected = "c23c6e2b5ee0c81e58f5ed917ea6b1548fd5223f53fc257328ab85f7a9fc933d"
          if ($hash -ne $expected) { throw "Patched helper SHA-256 mismatch: expected $expected, got $hash" }
          $runtime = "source-v1.2/runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item $built "$runtime/Kfps.ChassisConverter.WheelMorph.exe" -Force
          Write-Host "Verified staged helper SHA-256: $hash"

      - name: Build Standard OneFile
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4.spec
          if ($LASTEXITCODE -ne 0) { throw "Standard PyInstaller build failed with exit code $LASTEXITCODE" }
          $exe = Resolve-Path "dist\FH6 Assistant v1.4.exe"
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l $exe
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect Standard archive." }
          if (-not ($listing -match "Kfps\.ChassisConverter\.WheelMorph\.exe")) { throw "Standard OneFile does not contain the wheel morph helper." }
          if (-not ($listing -match "tire_preview_integration")) { throw "Standard OneFile does not contain the native tire preview integration module." }

      - name: Build Portable OneDir
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4_portable.spec
          if ($LASTEXITCODE -ne 0) { throw "Portable PyInstaller build failed with exit code $LASTEXITCODE" }
          $helper = "dist\FH6 Assistant v1.4 Portable\_internal\runtime\Kfps.ChassisConverter.WheelMorph.exe"
          if (-not (Test-Path $helper)) { throw "Portable build does not contain the wheel morph helper." }
          $hash = (Get-FileHash $helper -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c23c6e2b5ee0c81e58f5ed917ea6b1548fd5223f53fc257328ab85f7a9fc933d") { throw "Portable bundled helper SHA-256 mismatch: $hash" }

      - name: Upload W3 build candidates
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Assistant-v1.4-Wheel-Morph-W3-Build-Candidates
          path: |
            source-v1.2/dist/FH6 Assistant v1.4.exe
            source-v1.2/dist/FH6 Assistant v1.4 Portable
          retention-days: 14
          if-no-files-found: error
