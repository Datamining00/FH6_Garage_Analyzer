name: Apply FH6 Assistant i18n stage 1

on:
  push:
    branches:
      - v1.2-work
    paths:
      - ".github/workflows/apply-i18n-stage1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: v1.2-work
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Patch common and dashboard strings
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("source-v1.2/fh6garage/ui.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from .models import LiveryRecord, ScanResult, TuningRecord",
                  "from .i18n import tr\nfrom .models import LiveryRecord, ScanResult, TuningRecord",
              ),
              ('self.message = QLabel("처리 중…")', 'self.message = QLabel(tr("common.processing"))'),
              ('up.setToolTip(f"{label_text} 오름차순")', 'up.setToolTip(tr("common.ascending", label=label_text))'),
              ('up.setAccessibleName(f"{label_text} 오름차순")', 'up.setAccessibleName(tr("common.ascending", label=label_text))'),
              ('down.setToolTip(f"{label_text} 내림차순")', 'down.setToolTip(tr("common.descending", label=label_text))'),
              ('down.setAccessibleName(f"{label_text} 내림차순")', 'down.setAccessibleName(tr("common.descending", label=label_text))'),
              ('toast = QLabel("클립보드에 복사되었습니다", self)', 'toast = QLabel(tr("common.copied"), self)'),
              ('self._show_status("클립보드에 복사되었습니다", 1000)', 'self._show_status(tr("common.copied"), 1000)'),
              ('for index, text in enumerate(("대시보드", "리버리", "튜닝")):', 'for index, text in enumerate((tr("nav.dashboard"), tr("nav.livery"), tr("nav.tuning"))):'),
              ('self.always_on_top_box = QCheckBox("항상 위에 표시")', 'self.always_on_top_box = QCheckBox(tr("sidebar.always_on_top"))'),
              ('"인게임 이동을 시작하면 포르자 화면을 가리지 않도록 분석기 창을 최소화합니다."', 'tr("sidebar.always_on_top_tip")'),
              ('self.path_edit.setPlaceholderText("FH6 세이브 루트/current/버전/ContainersRoot 폴더를 선택하세요")', 'self.path_edit.setPlaceholderText(tr("save.placeholder"))'),
              ('choose = QPushButton("세이브 폴더 선택")', 'choose = QPushButton(tr("save.choose_folder"))'),
              ('refresh = QPushButton("새로고침")', 'refresh = QPushButton(tr("save.refresh"))'),
              ('layout.addLayout(self._page_header("차고 분석 대시보드", ""))', 'layout.addLayout(self._page_header(tr("dashboard.title"), ""))'),
              ('self.card_cars = SummaryCard("차고 차량", "—")', 'self.card_cars = SummaryCard(tr("dashboard.garage_cars"), "—")'),
              ('self.card_livery = SummaryCard("저장 리버리", "—")', 'self.card_livery = SummaryCard(tr("dashboard.saved_livery"), "—")'),
              ('self.card_tuning = SummaryCard("저장 튜닝", "—")', 'self.card_tuning = SummaryCard(tr("dashboard.saved_tuning"), "—")'),
              ('db_title = QLabel("차량 DB")', 'db_title = QLabel(tr("db.title"))'),
              ('self.db_last_update_label = QLabel("/ 마지막 업데이트: 확인 불가")', 'self.db_last_update_label = QLabel(tr("db.last_update_unavailable"))'),
              ('self.db_update_button = QPushButton("업데이트 확인")', 'self.db_update_button = QPushButton(tr("db.check_update"))'),
              ('self.db_update_button.setToolTip("차량 DB의 새로운 버전을 확인합니다.")', 'self.db_update_button.setToolTip(tr("db.check_update_tip"))'),
              ('self.db_source_button.setText("DB 출처")', 'self.db_source_button.setText(tr("db.source"))'),
              ('self.db_source_button.setToolTip("차량 DB 원본 페이지를 브라우저에서 엽니다.")', 'self.db_source_button.setToolTip(tr("db.source_tip"))'),
              ('self.db_source_button.setAccessibleName("차량 DB 출처 열기")', 'self.db_source_button.setAccessibleName(tr("db.source_accessible"))'),
              ('self.db_override_button = QPushButton("사용자 차량 이름 지정")', 'self.db_override_button = QPushButton(tr("db.override"))'),
              ('self.db_override_button.setToolTip("Car ID에 대응하는 차량 이름을 직접 지정하거나 수정합니다.")', 'self.db_override_button.setToolTip(tr("db.override_tip"))'),
              ('self.dashboard_car_button = QPushButton("차종별 저장 콘텐츠")', 'self.dashboard_car_button = QPushButton(tr("dashboard.by_vehicle"))'),
              ('self.dashboard_creator_button = QPushButton("제작자별 콘텐츠")', 'self.dashboard_creator_button = QPushButton(tr("dashboard.by_creator"))'),
              ('self.car_search.setPlaceholderText("Car ID / 차량명 검색")', 'self.car_search.setPlaceholderText(tr("dashboard.search_vehicle"))'),
              ('self.car_table = self._table(("Car ID", "차량", "리버리", "튜닝"))', 'self.car_table = self._table((tr("table.car_id"), tr("table.vehicle"), tr("table.livery"), tr("table.tuning")))'),
              ('            ("Car ID", "차량", "리버리", "튜닝"),', '            (tr("table.car_id"), tr("table.vehicle"), tr("table.livery"), tr("table.tuning")),'),
              ('self.creator_table = self._table(("합계", "제작자명", "리버리", "튜닝"))', 'self.creator_table = self._table((tr("table.total"), tr("table.creator"), tr("table.livery"), tr("table.tuning")))'),
              ('            ("합계", "제작자명", "리버리", "튜닝"),', '            (tr("table.total"), tr("table.creator"), tr("table.livery"), tr("table.tuning")),'),
              ('self.selected_title = QLabel("차량을 선택하세요")', 'self.selected_title = QLabel(tr("dashboard.select_vehicle"))'),
              ('self.saved_livery_section = QLabel("저장 리버리")', 'self.saved_livery_section = QLabel(tr("dashboard.saved_livery"))'),
              ('self.selected_liveries = self._table(("", "리버리 이름", "제작자"))', 'self.selected_liveries = self._table(("", tr("table.livery_name"), tr("table.creator_short")))'),
              ('self.saved_tuning_section = QLabel("저장 튜닝")', 'self.saved_tuning_section = QLabel(tr("dashboard.saved_tuning"))'),
              ('self.selected_tunings = self._table(("", "이름", "제작자", "크기"))', 'self.selected_tunings = self._table(("", tr("table.name"), tr("table.creator_short"), tr("table.size")))'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Expected source fragment was not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          '@ | Set-Content -Path apply_stage1.py -Encoding UTF8
          python apply_stage1.py
          Remove-Item apply_stage1.py -Force

      - name: Compile and run regression tests
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Commit stage 1 source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1.2/fh6garage/ui.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Localize common and dashboard UI strings"
            git push origin HEAD:v1.2-work
          } else {
            Write-Host "No UI changes to commit."
          }
