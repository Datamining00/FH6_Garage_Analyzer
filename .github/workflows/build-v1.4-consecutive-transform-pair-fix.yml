name: Build FH6 Assistant v1.4 Consecutive Transform Pair Fix

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-consecutive-transform-pair-fix
    paths:
      - ".github/workflows/build-v1.4-consecutive-transform-pair-fix.yml"
      - "source-v1.2/**"
  pull_request:
    branches:
      - v1.4-parser-structural-audit
    paths:
      - ".github/workflows/build-v1.4-consecutive-transform-pair-fix.yml"
      - "source-v1.2/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout consecutive-transform-pair branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vendor pinned KFPS backend
        shell: pwsh
        run: |
          $expected = "8965780b8966e09d2f2a17e4d0684cdd44d7437c"
          $vendor = Join-Path $PWD "source-v1.2\vendor\kfps"
          if (Test-Path $vendor) {
            Remove-Item $vendor -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $vendor) | Out-Null

          git clone --filter=blob:none --no-checkout https://github.com/heyitshestia/kloudys-forza-painter-suite.git $vendor
          git -C $vendor sparse-checkout init --no-cone
          @'
          /json_preview_renderer.py
          /geometry_json.py
          /LICENSE
          /tools/cgroup/
          /tools/livery/
          /tools/fabric-editor/shape-words.json
          /tools/fabric-editor/shape-names.json
          /tools/fabric-editor/Resources/Vinyls/
          '@ | Set-Content -Path (Join-Path $vendor ".git\info\sparse-checkout") -Encoding ascii
          git -C $vendor fetch --depth 1 origin $expected
          git -C $vendor checkout --detach FETCH_HEAD

          $actual = (git -C $vendor rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Unexpected KFPS vendor commit: $actual"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile and run regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build consecutive-transform-pair EXE
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4.spec

          $exe = Join-Path $PWD "dist\FH6 Assistant v1.4.exe"
          if (-not (Test-Path $exe)) {
            throw "FH6 Assistant v1.4.exe was not created."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) {
            throw "Built EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built EXE bytes: $size"

      - name: Prepare consecutive-transform-pair artifact
        shell: pwsh
        run: |
          $source = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4.exe"
          $name = "FH6 Assistant v1.4 Consecutive Transform Pair Fix Test.exe"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $target = Join-Path $PWD "artifact\$name"
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Path "artifact\$name.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload consecutive-transform-pair build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_Consecutive_Transform_Pair_Fix_Test
          path: |
            artifact/FH6 Assistant v1.4 Consecutive Transform Pair Fix Test.exe
            artifact/FH6 Assistant v1.4 Consecutive Transform Pair Fix Test.exe.sha256
          if-no-files-found: error
          compression-level: 0
