name: Validate FH6 Assistant v1.4 material shader parameters

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-morph-w3
    paths:
      - "source-v1.2/fh6garage/preview3d/material_shader_parameter_helper.py"
      - "source-v1.2/fh6garage/preview3d/manufacturer_material_parameter_composition.py"
      - "source-v1.2/fh6garage/preview3d/wheel_morph_helper.py"
      - "source-v1.2/tests/test_material_shader_parameter_helper.py"
      - "source-v1.2/tests/test_manufacturer_material_parameter_composition.py"
      - "source-v1.2/tests/test_wheel_morph_helper.py"
      - "source-v1.2/tools/analyze_manufacturer_material_parameters.py"
      - "source-v1.2/tools/Run_FH6_Material_Shader_Parameter_Diagnostic.cmd"
      - "source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py"
      - "source-v1.2/tools/patch_kfps_uv4_passthrough.py"
      - "source-v1.2/tools/patch_kfps_materialbin_diagnostic.py"
      - "source-v1.2/tools/kfps_wheel_morph/MaterialShaderParameterDiagnostic.cs"
      - ".github/workflows/validate-v1.4-material-shader-parameters.yml"

permissions:
  contents: read

concurrency:
  group: v14-material-shader-parameters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} parameter contracts
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile parameter diagnostic path
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/material_shader_parameter_helper.py
          python -m py_compile fh6garage/preview3d/manufacturer_material_parameter_composition.py
          python -m py_compile fh6garage/preview3d/wheel_morph_helper.py
          python -m py_compile tools/analyze_manufacturer_material_parameters.py
          python -m py_compile tools/patch_kfps_materialbin_diagnostic.py

      - name: Run parameter targeted contracts
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest tests.test_material_shader_parameter_helper -v
          python -m unittest tests.test_manufacturer_material_parameter_composition -v
          python -m unittest tests.test_materialbin_reference_helper_source -v
          python -m unittest tests.test_wheel_morph_helper -v

      - name: Run full regression suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

  package:
    name: Package read-only parameter diagnostic
    runs-on: windows-latest
    needs: python

    steps:
      - name: Checkout W3 branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Validate source contracts
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m py_compile fh6garage/preview3d/material_shader_parameter_helper.py
          python -m py_compile fh6garage/preview3d/manufacturer_material_parameter_composition.py
          python -m py_compile tools/analyze_manufacturer_material_parameters.py
          python -m unittest tests.test_material_shader_parameter_helper -v
          python -m unittest tests.test_manufacturer_material_parameter_composition -v
          python -m unittest tests.test_wheel_morph_helper -v

      - name: Checkout pinned KFPS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --filter=blob:none https://github.com/heyitshestia/kloudys-forza-painter-suite.git kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS clone failed with exit code $LASTEXITCODE" }
          git -C kfps-source checkout --detach 6f53ca3c584d78659d06d4b4a39561db67d79345
          if ($LASTEXITCODE -ne 0) { throw "Pinned KFPS checkout failed with exit code $LASTEXITCODE" }
          $actual = (git -C kfps-source rev-parse HEAD).Trim()
          if ($actual -ne "6f53ca3c584d78659d06d4b4a39561db67d79345") { throw "Pinned KFPS commit mismatch: $actual" }

      - name: Apply canonical W3 UV4 and parameter helper patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python source-v1.2/tools/patch_kfps_wheel_morph_diagnostic.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS base patcher failed with exit code $LASTEXITCODE" }
          python source-v1.2/tools/patch_kfps_uv4_passthrough.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS UV4 patcher failed with exit code $LASTEXITCODE" }
          python source-v1.2/tools/patch_kfps_materialbin_diagnostic.py --kfps-root kfps-source
          if ($LASTEXITCODE -ne 0) { throw "KFPS parameter patcher failed with exit code $LASTEXITCODE" }
          git -C kfps-source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched KFPS diff check failed" }
          $program = "kfps-source/tools/livery/chassis-converter/Program.cs"
          if (-not (Select-String -Path $program -SimpleMatch "--diagnose-material-shader-parameters" -Quiet)) { throw "Material/shader parameter CLI was not staged." }
          if (-not (Select-String -Path $program -SimpleMatch "MaterialShaderParameterRuntime.Diagnose" -Quiet)) { throw "Material/shader parameter runtime was not staged." }
          if (-not (Test-Path "kfps-source/tools/livery/chassis-converter/MaterialShaderParameterDiagnostic.cs")) { throw "MaterialShaderParameterDiagnostic.cs was not staged." }

      - name: Publish and verify bundled helper v14
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish kfps-source/tools/livery/chassis-converter/Kfps.ChassisConverter.csproj -c Release -o parameter-converter
          if ($LASTEXITCODE -ne 0) { throw "Parameter helper publish failed with exit code $LASTEXITCODE" }
          $built = Resolve-Path "parameter-converter/Kfps.ChassisConverter.exe"
          $actual = (Get-FileHash $built -Algorithm SHA256).Hash.ToLower()
          $expected = (python -c "import runpy; print(runpy.run_path(r'source-v1.2/fh6garage/preview3d/wheel_morph_helper.py')['WHEEL_MORPH_HELPER_SHA256'])").Trim()
          if ($actual -ne $expected) { throw "Parameter helper SHA-256 mismatch: expected $expected, got $actual" }
          New-Item -ItemType Directory -Force "source-v1.2/runtime" | Out-Null
          Copy-Item $built "source-v1.2/runtime/Kfps.ChassisConverter.WheelMorph.exe" -Force
          Write-Host "Verified material/shader parameter helper SHA-256: $actual"

      - name: Run source self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          $json = python tools/analyze_manufacturer_material_parameters.py --self-check
          if ($LASTEXITCODE -ne 0) { throw "Source parameter self-check failed with exit code $LASTEXITCODE" }
          $report = $json | ConvertFrom-Json
          if ($report.status -ne "material_shader_parameter_self_check_passed") { throw "Source self-check status mismatch: $($report.status)" }
          if ($report.game_data_modified -ne $false) { throw "Source self-check did not preserve read-only contract." }
          if ($report.rendering_enabled -ne $false) { throw "Source self-check unexpectedly enabled rendering." }

      - name: Build standalone parameter diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm --onefile --console --name "FH6 Material Shader Parameter Diagnostic" --add-binary "runtime\Kfps.ChassisConverter.WheelMorph.exe;runtime" tools\analyze_manufacturer_material_parameters.py
          if ($LASTEXITCODE -ne 0) { throw "Standalone parameter diagnostic build failed with exit code $LASTEXITCODE" }
          $exe = Resolve-Path "dist\FH6 Material Shader Parameter Diagnostic.exe"
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l -r $exe
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect standalone parameter diagnostic archive." }
          if (-not ($listing -match "material_shader_parameter_helper")) { throw "Standalone diagnostic does not contain the Python parameter helper." }
          if (-not ($listing -match "manufacturer_material_parameter_composition")) { throw "Standalone diagnostic does not contain the composition bridge." }
          if (-not ($listing -match "Kfps\.ChassisConverter\.WheelMorph\.exe")) { throw "Standalone diagnostic does not contain the verified KFPS helper." }

      - name: Run packaged self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = Resolve-Path "source-v1.2/dist/FH6 Material Shader Parameter Diagnostic.exe"
          $lines = & $exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "Packaged parameter self-check failed with exit code $LASTEXITCODE" }
          $report = ($lines -join "`n") | ConvertFrom-Json
          $expected = (python -c "import runpy; print(runpy.run_path(r'source-v1.2/fh6garage/preview3d/wheel_morph_helper.py')['WHEEL_MORPH_HELPER_SHA256'])").Trim()
          if ($report.status -ne "material_shader_parameter_self_check_passed") { throw "Packaged self-check status mismatch: $($report.status)" }
          if ($report.helper_sha256 -ne $expected) { throw "Packaged self-check helper SHA mismatch." }
          if ($report.game_data_modified -ne $false) { throw "Packaged self-check did not preserve read-only contract." }
          if ($report.rendering_enabled -ne $false) { throw "Packaged self-check unexpectedly enabled rendering." }

      - name: Stage user-facing parameter diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "source-v1.2/dist/FH6 Material Shader Parameter Diagnostic"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "source-v1.2/dist/FH6 Material Shader Parameter Diagnostic.exe" "$stage/FH6 Material Shader Parameter Diagnostic.exe" -Force
          Copy-Item "source-v1.2/tools/Run_FH6_Material_Shader_Parameter_Diagnostic.cmd" "$stage/Run_FH6_Material_Shader_Parameter_Diagnostic.cmd" -Force
          @"
          FH6 Material + Shader Parameter Diagnostic

          1. Run Run_FH6_Material_Shader_Parameter_Diagnostic.cmd
          2. Select the *_manufacturer_materialbin_p3f.json produced by the current P3F build.
          3. The tool reads only the exact cached materialbin/shaderbin paths already recorded in that JSON.
          4. Result JSON is written under %%LOCALAPPDATA%%\FH6 Assistant\Diagnostics.

          No FH6 game/save data is modified. Rendering remains disabled in this diagnostic.
          "@ | Set-Content -LiteralPath "$stage/README.txt" -Encoding UTF8

      - name: Upload material shader parameter diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: FH6-v1.4-MaterialShaderParameter-Diagnostic
          path: source-v1.2/dist/FH6 Material Shader Parameter Diagnostic
          if-no-files-found: error
          retention-days: 14
