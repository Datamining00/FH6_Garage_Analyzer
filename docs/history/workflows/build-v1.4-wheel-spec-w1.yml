name: Build FH6 Assistant v1.4 WheelSpec W1

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-spec-w1
    paths:
      - "source-v1.2/**"
      - ".github/workflows/build-v1.4-wheel-spec-w1.yml"

permissions:
  contents: read

concurrency:
  group: v14-wheel-spec-w1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build W1 candidates
    runs-on: windows-latest

    steps:
      - name: Checkout W1 branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-v1.2/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: Compile and run regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Set-Location source-v1.2
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build Standard OneFile
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.4.exe"
          if (-not (Test-Path $exe)) { throw "Standard EXE was not created." }
          if ((Get-Item $exe).Length -lt 10000000) { throw "Standard EXE is unexpectedly small." }

      - name: Smoke test Standard
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $env:PYINSTALLER_STRICT_UNPACK_MODE = "1"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Standard EXE did not complete smoke test."
          }
          if ($proc.ExitCode -ne 0) { throw "Standard EXE exited with code $($proc.ExitCode)." }

      - name: Package Standard
        shell: pwsh
        run: |
          $dst = "package_standard\FH6 Assistant v1.4 WheelSpec W1 Standard"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4.exe"
          Copy-Item $exe "$dst\FH6 Assistant v1.4 WheelSpec W1.exe" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FH6 Assistant v1.4 WheelSpec W1.exe" | Set-Content "$dst\SHA256.txt" -Encoding ascii
          @"
          FH6 Assistant v1.4 - WheelSpec W1 experimental build
          Branch: v1.4-rc1-wheel-spec-w1
          Stage W1 adds the read-only FH6 wheel-spec resolver foundation.
          No stable/deployment branch has been merged.
          "@ | Set-Content "$dst\README.txt" -Encoding utf8

      - name: Build Portable OneDir
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m PyInstaller --clean --noconfirm .\FH6_Assistant_v1.4_portable.spec
          $exe = Join-Path $PWD "dist\FH6 Assistant v1.4 Portable\FH6 Assistant v1.4.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE was not created." }

      - name: Smoke test Portable
        shell: pwsh
        run: |
          $env:FH6_ASSISTANT_SMOKE_TEST_MS = "3000"
          $exe = Resolve-Path "source-v1.2\dist\FH6 Assistant v1.4 Portable\FH6 Assistant v1.4.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Portable EXE did not complete smoke test."
          }
          if ($proc.ExitCode -ne 0) { throw "Portable EXE exited with code $($proc.ExitCode)." }

      - name: Package Portable
        shell: pwsh
        run: |
          $dst = "package_portable\FH6 Assistant v1.4 WheelSpec W1 Portable"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "source-v1.2\dist\FH6 Assistant v1.4 Portable\*" $dst -Recurse -Force
          $root = (Resolve-Path $dst).Path
          $lines = foreach ($file in Get-ChildItem $dst -File -Recurse | Sort-Object FullName) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = $file.FullName.Substring($root.Length + 1)
            "$hash  $relative"
          }
          $lines | Set-Content "$dst\FILES_SHA256.txt" -Encoding ascii

      - name: Package Source
        shell: pwsh
        run: |
          $dst = "package_source\FH6 Assistant v1.4 WheelSpec W1 Source"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $files = @(
            "FH6 Assistant.vbs",
            "run.bat",
            "setup_and_run.ps1",
            "app.py",
            "requirements.txt",
            "README.txt",
            "version_info.txt",
            "build_exe.ps1",
            "FH6_Assistant_v1.4.spec",
            "FH6_Assistant_v1.4_portable.spec"
          )
          foreach ($file in $files) {
            if (Test-Path "source-v1.2\$file") { Copy-Item "source-v1.2\$file" $dst -Force }
          }
          foreach ($directory in @("data", "icons", "fh6garage", "tests", "tools")) {
            if (Test-Path "source-v1.2\$directory") { Copy-Item "source-v1.2\$directory" $dst -Recurse -Force }
          }
          Get-ChildItem $dst -Directory -Recurse -Filter "__pycache__" | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem $dst -File -Recurse | Where-Object { $_.Extension -in @(".pyc", ".pyo") } | Remove-Item -Force
          $root = (Resolve-Path $dst).Path
          $lines = foreach ($file in Get-ChildItem $dst -File -Recurse | Sort-Object FullName) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = $file.FullName.Substring($root.Length + 1)
            "$hash  $relative"
          }
          $lines | Set-Content "$dst\FILES_SHA256.txt" -Encoding ascii

      - name: Upload Standard build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_WheelSpec_W1_Standard
          path: package_standard/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Portable build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_WheelSpec_W1_Portable
          path: package_portable/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Source build
        uses: actions/upload-artifact@v6
        with:
          name: FH6_Assistant_v1.4_WheelSpec_W1_Source_Build
          path: package_source/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
