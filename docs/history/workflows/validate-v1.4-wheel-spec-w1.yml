name: Validate FH6 Assistant v1.4 wheel spec W1

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4-rc1-wheel-spec-w1
    paths:
      - "source-v1.2/**"
      - ".github/workflows/validate-v1.4-wheel-spec-w1.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Python ${{ matrix.python-version }} regression
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile source
        shell: pwsh
        run: |
          Set-Location source-v1.2
          python -m compileall -q .

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location source-v1.2
          python -m unittest discover -s tests -v

      - name: Upload W1 source artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: FH6_Assistant_v1.4_WheelSpec_W1_Source
          if-no-files-found: error
          retention-days: 30
          path: |
            source-v1.2/fh6garage/preview3d/wheel_spec.py
            source-v1.2/tools/resolve_wheel_spec.py
            source-v1.2/tests/test_wheel_spec.py
            .github/workflows/validate-v1.4-wheel-spec-w1.yml
